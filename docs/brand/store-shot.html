<!DOCTYPE html>
<!--
  Source for the seven Google Play phone screenshots
  (fastlane/metadata/android/en-US/images/phoneScreenshots/1.png to 7.png), 1080x1920 each.
  One template; the slot comes from the query string: store-shot.html?n=1 to ?n=7.
  docs/brand/render-store.sh renders all seven.

  Every screen is a real capture in docs/brand/store-src/, nothing is drawn over the app:

    A*.png  the current Play build on an emulator ("Sam's phone"), one status bar clock for all
            of them, with a year of generated Health Connect data from a watch, generated
            per-app usage, and a lived-in history of syncs, backfill and readings received
            from Home Assistant
    H*.png  a throwaway Home Assistant with the Life Dashboard integration paired to that phone;
            the pairing QR code holds a dummy link, not the real secret
    S*.png  the separate Life Dashboard Stack fed by the same phone: a Grafana panel and a
            local model in Open WebUI answering through the stack's MCP server

  Nothing in them is anyone's real data. The app's own UI fills at least half of every frame;
  other products appear only as labelled panels. Captions stay free of prices, rankings and
  calls to action (Play metadata policy) and under 20% of the image.

  Same identity as the other brand files: heartbeat green #30B77E, the dark green-tinted
  gradient and the faint grid, "Helvetica Neue".
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    --accent: #30B77E; --glow: rgba(48,183,126,0.14);
    background: radial-gradient(130% 130% at 25% 20%, #173229 0%, #11231E 45%, #0C1815 100%);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; position: relative;
  }
  body.purple {
    --accent: #B79BFF; --glow: rgba(155,120,255,0.16);
    background: radial-gradient(130% 130% at 25% 20%, #241D38 0%, #19162A 45%, #110F1C 100%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(48,183,126,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,183,126,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
  }
  body.purple .grid {
    background-image:
      linear-gradient(rgba(155,120,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,120,255,0.05) 1px, transparent 1px);
  }
  .glow { position: absolute; left: 50%; top: 900px; width: 1000px; height: 1000px; transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; }

  /* Caption: at most two headline lines and one subline, inside the top 20% (384px). */
  .caption { position: absolute; left: 60px; right: 60px; top: 58px; text-align: center; }
  h1 { font-size: 80px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.04; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 18px; font-size: 36px; line-height: 1.3; color: #AEB8BC; font-weight: 400; }

  /* A generic phone: no camera bump or outline of any real model. */
  .phone {
    position: absolute; left: 80px; top: 404px; width: 920px; height: 1640px;
    border-radius: 72px; border: 14px solid #0B0E0D; background: #0B0E0D; overflow: hidden;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.10), 0 40px 90px rgba(0,0,0,0.55), 0 0 140px var(--glow);
  }
  .phone .screen { position: absolute; inset: 0; border-radius: 58px; overflow: hidden; }
  .phone .screen img { width: 100%; display: block; }

  /* Another product, shown as a labelled panel over the phone. */
  .panel { position: absolute; }
  .panel .label {
    display: inline-block; white-space: nowrap; margin-bottom: 12px; padding: 10px 20px; border-radius: 18px;
    font-size: 27px; font-weight: 700; line-height: 1.25; color: var(--accent);
    background: #0A100E; border: 2px solid rgba(255,255,255,0.14);
  }
  body.purple .panel .label { background: #110E1C; }
  .panel .label small { display: block; font-size: 22px; font-weight: 400; color: #AEB8BC; }
  .panel .frame {
    width: fit-content; border-radius: 26px; overflow: hidden; background: #111;
    border: 2px solid rgba(255,255,255,0.16);
    box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 0 0 10px rgba(0,0,0,0.14);
  }
  .crop { background-repeat: no-repeat; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="caption"><h1 id="h"></h1><div class="sub" id="s"></div></div>
<div id="stage"></div>

<script>
// Crop a real capture: rect is [x, y, w, h] in capture pixels, shown `width` wide.
function crop(src, rect, width, srcW = 1080) {
  const [x, y, w, h] = rect, k = width / w;
  return `<div class="crop" style="width:${width}px;height:${Math.round(h * k)}px;background-image:url(${src});` +
    `background-size:${Math.round(srcW * k)}px auto;background-position:${-Math.round(x * k)}px ${-Math.round(y * k)}px"></div>`;
}
const phone = (src) => `<div class="phone"><div class="screen"><img src="${src}" alt=""></div></div>`;
// A phone screen made of horizontal bands of one capture, stacked, on the app's background:
// leaves out a band that holds a secret (a webhook URL) without drawing anything over the app.
const parts = (src, bands) => `<div class="phone"><div class="screen" style="background:#0D1117">` +
  bands.map(([y0, y1]) => crop(src, [0, y0, 1080, y1 - y0], 892)).join("") + `</div></div>`;
const panel = (label, html, css, note) =>
  `<div class="panel" style="${css}"><div class="label">${label}${note ? `<small>${note}</small>` : ""}</div>` +
  `<div class="frame">${html}</div></div>`;

const SRC = "store-src/";
const slots = {
  1: { h: "Health Connect to<br><em>your own server</em>", s: "Home Assistant, MQTT or your own webhook",
       html: phone(SRC + "A1-health.png") +
             panel("Your webhook, in self-hosted Grafana", crop(SRC + "S1-grafana.png", [0, 0, 1000, 840], 430, 1000),
                   "right:22px; top:1000px;") +
             panel("Home Assistant", crop(SRC + "H1-today.png", [18, 296, 1046, 318], 784, 1082),
                   "right:22px; top:1548px;", "from your watch, ring or scale via Health Connect") },
  2: { h: "Pair with<br><em>one QR code</em>", s: "No account, no YAML, no broker",
       html: phone(SRC + "A2-pair.png") +
             panel("Home Assistant", crop(SRC + "H2-qr.png", [62, 232, 848, 848], 286, 1082),
                   "right:30px; top:392px;") },
  3: { h: "Up to a year of <em>history</em>", s: "Each day on its own date in Home Assistant",
       html: phone(SRC + "A3-backfill.png") +
             `<div class="panel" style="left:105px; top:1150px; width:870px;"><div class="label" style="float:right">Home Assistant</div></div>` +
             `<div class="panel" style="left:105px; top:1226px;"><div class="frame" style="display:flex; gap:6px; background:#111">` +
               crop(SRC + "H3-history.png", [20, 296, 1044, 735], 430, 1082) +
               crop(SRC + "H3-history.png", [20, 1055, 1044, 735], 430, 1082) + `</div></div>` },
  4: { h: "Screen time <em>per app</em>", s: "You choose which apps are sent", cls: "purple",
       html: phone(SRC + "A4-screen-time.png") +
             panel("Home Assistant", crop(SRC + "H4-apps.png", [20, 468, 1042, 954], 500, 1082),
                   "right:22px; top:1090px;") },
  5: { h: "Your history, for<br><em>your own AI</em>", s: "A model you run, via the separate Life Dashboard Stack",
       html: phone(SRC + "A5-webhook.png") +
             panel("Separate self-hosted Life Dashboard Stack,<br>model on your own server", crop(SRC + "S5-chat.png", [24, 190, 1040, 500], 600, 1082),
                   "right:22px; top:1030px;") },
  6: { h: "Edits and deletions<br>are <em>sent too</em>", s: "Signed JSON for n8n, Node-RED or your scripts",
       html: phone(SRC + "A6-payload.png") +
             panel("Webhook settings", crop(SRC + "A6-signing.png", [40, 0, 1000, 250], 600),
                   "right:22px; top:1600px;") },
  7: { h: "Scale readings into<br><em>Health Connect</em>", s: "Weight and blood pressure from Home Assistant",
       html: parts(SRC + "A7-receive.png", [[0, 665], [855, 1605]]) +
             panel("Health Connect", crop(SRC + "A7-hc-weight.png", [30, 500, 1020, 560], 470),
                   "right:22px; top:1596px;") },
};

const n = +(new URLSearchParams(location.search).get("n") || 1);
const slot = slots[n];
document.getElementById("h").innerHTML = slot.h;
document.getElementById("s").innerHTML = slot.s;
if (slot.cls) document.body.classList.add(slot.cls);
document.getElementById("stage").innerHTML = slot.html;
</script>
</body>
</html>
