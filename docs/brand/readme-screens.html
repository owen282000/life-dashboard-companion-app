<!DOCTYPE html>
<!--
  Source for docs/readme-screens.png, the row of app screens in the README: four
  screenshots from docs/screenshots/ with a caption under each. Drawn at twice the size it
  is shown at (900 px wide in the README), with transparent corners so it sits on GitHub's
  light and dark theme alike. The ground and font of the app: #0A0F0D, #30B77E, Space Grotesk.
  Swap a screenshot in docs/screenshots/ and render again to update it.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=docs/readme-screens.png --window-size=1800,1090 \
      --hide-scrollbars --force-device-scale-factor=1 \
      --default-background-color=00000000 docs/brand/readme-screens.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 400; src: url(../../app/src/main/res/font/space_grotesk_regular.ttf); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(../../app/src/main/res/font/space_grotesk_bold.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1800px; height: 1090px; overflow: hidden; background: transparent; }
  .card {
    position: absolute; inset: 0; border-radius: 40px; overflow: hidden;
    background: radial-gradient(90% 70% at 30% 25%, rgba(48,183,126,0.10), rgba(48,183,126,0)), #0A0F0D;
    font-family: "Space Grotesk", sans-serif; color: #EEF4F0;
  }
  .row {
    position: absolute; left: 0; right: 0; top: 64px;
    display: flex; justify-content: center; gap: 64px;
  }
  .shot { width: 360px; }
  .phone {
    width: 360px; height: 800px; border-radius: 40px; overflow: hidden;
    border: 3px solid #27332D;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 0 0 10px rgba(255,255,255,0.025);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  h3 { margin-top: 34px; font-size: 32px; font-weight: 700; letter-spacing: -0.3px; }
  p { margin-top: 8px; font-size: 25px; line-height: 1.35; color: #B9C4BE; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="shot">
      <div class="phone"><img src="../screenshots/health-connect.png" alt=""></div>
      <h3>Health Connect</h3>
      <p>Where your data goes, and today's figures</p>
    </div>
    <div class="shot">
      <div class="phone"><img src="../screenshots/screen-time.png" alt=""></div>
      <h3>Screen time</h3>
      <p>Minutes per app, with your own day boundary</p>
    </div>
    <div class="shot">
      <div class="phone"><img src="../screenshots/what-to-send.png" alt=""></div>
      <h3>What to send</h3>
      <p>The essentials, or pick by category and type</p>
    </div>
    <div class="shot">
      <div class="phone"><img src="../screenshots/logs.png" alt=""></div>
      <h3>Logs</h3>
      <p>Every delivery, with its status and payload</p>
    </div>
  </div>
</div>
</body>
</html>
