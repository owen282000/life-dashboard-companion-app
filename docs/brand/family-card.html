<!DOCTYPE html>
<!--
  Source for the four project cards in the "Part of Life Dashboard" section of all four
  READMEs (docs/family/<part>.png and docs/family/<part>-here.png). One file draws every card;
  the query string picks the part (?p=android|ios|ha|stack) and &here=1 draws the "You're here"
  variant for the repository the README belongs to. Drawn at twice the size it is shown at
  (400 px wide), with transparent corners so it sits on GitHub's light and dark theme alike.
  Same identity as banner.html: #14181C to #101C1C, accent #30B77E. render-family.sh renders
  all eight from the repository root.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=docs/family/android.png --window-size=800,232 \
      --hide-scrollbars --force-device-scale-factor=1 \
      --default-background-color=00000000 "docs/brand/family-card.html?p=android"
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 232px; overflow: hidden; background: transparent; }
  .card {
    position: absolute; inset: 4px; border-radius: 30px; overflow: hidden;
    background: radial-gradient(130% 130% at 20% 15%, #171D21 0%, #14181C 45%, #101C1C 100%);
    border: 2px solid rgba(255,255,255,0.10);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #E8EDEF;
    display: flex; align-items: center; padding: 0 40px 0 36px; gap: 30px;
  }
  .here .card {
    border: 3px solid rgba(48,183,126,0.75);
    background: radial-gradient(130% 130% at 20% 15%, #18241F 0%, #14191B 50%, #101C1C 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.5; pointer-events: none;
    background-image:
      linear-gradient(rgba(48,183,126,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,183,126,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .tile {
    position: relative; flex: none; width: 112px; height: 112px; border-radius: 28px;
    background: rgba(48,183,126,0.09); border: 2px solid rgba(48,183,126,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .tile svg { width: 60px; height: 60px; }
  .text { position: relative; flex: 1; min-width: 0; }
  .kicker {
    font-size: 21px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase;
    color: #7E8B91;
  }
  .name { margin-top: 8px; font-size: 40px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.1; white-space: nowrap; }
  .desc { margin-top: 8px; font-size: 27px; line-height: 1.3; color: #AEB8BC; white-space: nowrap; }
  .corner { position: absolute; top: 30px; right: 32px; }
  .pill {
    padding: 6px 18px; border-radius: 999px; white-space: nowrap;
    background: #162420; border: 2px solid rgba(48,183,126,0.55);
    font-size: 20px; color: #6FD7A6; font-weight: 700;
  }
  .arrow svg { width: 34px; height: 34px; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="tile"><svg id="glyph" viewBox="0 0 24 24" fill="none" stroke="#30B77E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></div>
  <div class="text">
    <div class="kicker" id="kicker"></div>
    <div class="name" id="name"></div>
    <div class="desc" id="desc"></div>
  </div>
  <div class="corner" id="corner"></div>
</div>
<script>
  const parts = {
    android: { kicker: "On your phone", name: "Android app", desc: "Health Connect and screen time",
      glyph: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>' },
    ios: { kicker: "On your phone", name: "iPhone app", desc: "Apple Health",
      glyph: '<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10 5h4"/>' },
    ha: { kicker: "Where the data goes", name: "Home Assistant integration", desc: "Sensors and a year of history",
      glyph: '<path d="M3.5 11 12 3.5l8.5 7.5"/><path d="M5.5 9.5V20h13V9.5"/><circle cx="12" cy="13.5" r="2"/><path d="M12 15.5V20"/>' },
    stack: { kicker: "Where the data goes", name: "Grafana stack", desc: "Postgres and Grafana dashboards",
      glyph: '<path d="M4 20h16"/><path d="M6.5 16v-4"/><path d="M11 16V7"/><path d="M15.5 16v-6"/><path d="M20 16V4"/>' }
  };
  const q = new URLSearchParams(location.search);
  const p = parts[q.get("p")] || parts.android;
  const here = q.get("here") === "1";
  if (here) document.body.classList.add("here");
  document.getElementById("kicker").textContent = p.kicker;
  document.getElementById("name").textContent = p.name;
  document.getElementById("desc").textContent = p.desc;
  document.getElementById("glyph").innerHTML = p.glyph;
  document.getElementById("corner").innerHTML = here
    ? '<div class="pill">You’re here</div>'
    : '<div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#5C6A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></div>';
</script>
</body>
</html>
