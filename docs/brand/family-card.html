<!DOCTYPE html>
<!--
  Source for the pictures in the "Part of Life Dashboard" section of every Life Dashboard README
  (docs/family/). One file draws every tile and the arrow between the groups; the query string
  picks the part (?p=android|ios|stack|ha|own-server|sleep-card|screen-time-card|year-card|
  activity-card|before-bed-card|arrow), the theme (&theme=dark|light, for GitHub's dark and light
  mode) and &here=1 for the "You're here" variant of the repository the README belongs to.

  The section reads top to bottom: the app on your phone, an arrow, where the data goes, an arrow,
  the cards for a Home Assistant dashboard. The headings and the two lines of text around the
  arrows are real text in the README, so only the tiles and the arrow are pictures.

  Tiles are drawn at the size below and shown a little smaller in the README (width 198 for the
  two apps, 168 for the places the data goes, 156 for the cards), so five cards fit next to each
  other on a desktop and two on a phone. The corners and the strip above a tile are transparent;
  the "You're here" tag sits on the top border.

  To add a part: add an entry to `parts` below, add its name to render-family.sh, run that script
  from the repository root and copy docs/family/ to the other repositories.

  Colours follow GitHub's dark and light theme. The chips pass WCAG AA in both.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: transparent; }
  [hidden] { display: none !important; }
  body {
    --tile: #161b22; --here: #13231a; --border: #30363d; --text: #e6edf3; --muted: #9198a1;
    --icon: #9198a1; --line: #7d8590; --accent: #3fb950; --on-accent: #0d1117;
    --chip: #173822; --chip-text: #56d364; --dashed: #545d68; --track: #262c36;
    --g0: #0e4429; --g1: #006d32; --g2: #26a641; --g3: #39d353;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body.light {
    --tile: #f6f8fa; --here: #eaf6ee; --border: #d0d7de; --text: #1f2328; --muted: #4b5560;
    --icon: #59636e; --line: #818b96; --accent: #1a7f37; --on-accent: #ffffff;
    --chip: #dafbe1; --chip-text: #116329; --dashed: #8c959f; --track: #e6eaef;
    --g0: #9be9a8; --g1: #40c463; --g2: #30a14e; --g3: #216e39;
  }
  /* render-family.sh sets the window to the size of the picture. Chrome lays a narrow window
     out wider than it is, so the width per kind of tile is repeated here. */
  .wrap { position: fixed; left: 0; top: 0; bottom: 0; padding-top: 12px; }
  .phone { width: 236px; } .dest { width: 200px; } .card { width: 186px; }
  .tile {
    position: relative; height: 100%; border: 1px solid var(--border); border-radius: 14px;
    background: var(--tile); padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 8px;
  }
  .card .tile { padding: 16px 16px 18px; }
  .dest .tile { padding-left: 14px; padding-right: 14px; }
  .own .tile { border: 1.5px dashed var(--dashed); background: transparent; }
  .here .tile { border: 2px solid var(--accent); background: var(--here); padding: 17px 17px 19px; }
  .here.card .tile { padding: 15px 15px 17px; }
  .here.dest .tile { padding-left: 13px; padding-right: 13px; }
  .tag {
    display: none; position: absolute; top: -12px; left: 14px; font-size: 11px; font-weight: 700;
    line-height: 16px; padding: 3px 9px; border-radius: 7px; background: var(--accent);
    color: var(--on-accent); white-space: nowrap;
  }
  .here .tag { display: block; }
  .art { height: 64px; display: flex; align-items: center; justify-content: center; }
  .card .art { height: 72px; display: block; }
  .name { font-size: 16px; font-weight: 600; line-height: 19px; white-space: nowrap; }
  .card .name { font-size: 15px; line-height: 18px; }
  .desc { font-size: 13px; line-height: 1.4; color: var(--muted); text-wrap: balance; }
  .chips { margin-top: auto; padding-top: 12px; display: flex; gap: 5px; white-space: nowrap; }
  .chips span {
    font-size: 11px; font-weight: 600; line-height: 16px; padding: 3px 8px; border-radius: 999px;
    background: var(--chip); color: var(--chip-text);
  }
  /* Line icons: grey strokes, with the part that matters in the accent. */
  svg.icon { fill: none; stroke: var(--icon); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  svg.icon .a { stroke: var(--accent); }
  svg.icon .af { stroke: var(--accent); fill: var(--accent); }
  svg.icon .if { fill: var(--icon); }
  /* Small previews of the cards. */
  .rows { height: 72px; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
  .lane { height: 7px; border-radius: 4px; background: var(--track); position: relative; }
  .lane span { position: absolute; top: 0; height: 7px; border-radius: 3px; }
  .split { height: 72px; display: flex; align-items: center; gap: 14px; }
  .donut { width: 46px; height: 46px; border-radius: 50%; border: 7px solid #e3b341; border-right-color: var(--track); flex: none; }
  .bars { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .bars div { height: 7px; border-radius: 4px; background: var(--track); }
  .bars i { display: block; height: 7px; border-radius: 4px; }
  .year { height: 72px; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; align-content: center; }
  .year span { display: block; height: 8px; border-radius: 2px; }
  .rings { height: 72px; display: flex; align-items: center; justify-content: space-between; }
  .rings div { width: 44px; height: 44px; border-radius: 50%; border: 6px solid; }
  .night { height: 8px; border-radius: 4px; background: var(--track); display: flex; align-items: center; gap: 4px; }
  .night i { width: 5px; height: 8px; border-radius: 2px; background: #e3b341; }
  .night b { flex: 1; height: 8px; border-radius: 4px; background: #8b6ff0; }
  /* The arrow between the groups. */
  .arrow { position: fixed; left: 0; top: 0; bottom: 0; width: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .arrow div { width: 2px; height: 22px; background: var(--line); }
  .arrow svg { display: block; fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="tile">
    <span class="tag">You're here</span>
    <div class="art" id="art"></div>
    <div class="name" id="name"></div>
    <div class="desc" id="desc"></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div class="arrow" id="arrow" hidden>
  <div></div>
  <svg width="14" height="9" viewBox="0 0 14 9"><path d="M1 1.5l6 6 6-6"/></svg>
</div>
<script>
  const lane = (color, blocks) => '<div class="lane">' + blocks.map(([side, at, w]) =>
    '<span style="' + side + ':' + at + 'px;width:' + w + 'px;background:' + color + '"></span>').join("") + '</div>';
  const night = (pad, screens, gap) => '<div class="night" style="padding-left:' + pad + 'px">' +
    '<i></i>'.repeat(screens) + '<b style="margin-left:' + gap + 'px"></b></div>';
  // Fixed pattern, so every render is the same picture.
  const yearCells = [3,2,3,1,2,3,3,2,0,3,2,3,1,2, 2,3,3,2,3,1,3,3,2,3,2,0,3,3, 1,2,3,3,2,3,2,1,3,2,3,3,2,1,
    3,3,1,2,3,2,3,3,2,3,1,2,3,3, 2,3,2,3,3,1,2,3,3,2,3,3,2,3];
  const t = "var(--track)";

  const parts = {
    "android": { kind: "phone", name: "Android app", desc: "Health Connect and screen time", chips: ["Google Play", "F-Droid"],
      art: '<svg class="icon" width="44" height="64" viewBox="0 0 44 64"><rect x="3" y="2" width="38" height="60" rx="7"/>' +
        '<circle class="if" cx="22" cy="8" r="1.4"/><path class="a" d="M14 46v-6M22 46v-12M30 46v-9"/><circle class="a" cx="22" cy="24" r="6"/></svg>' },
    "ios": { kind: "phone", name: "iPhone app", desc: "Apple Health", chips: ["App Store", "Build it yourself"],
      art: '<svg class="icon" width="44" height="64" viewBox="0 0 44 64"><rect x="3" y="2" width="38" height="60" rx="7"/><path d="M17 7h10"/>' +
        '<path class="a" d="M22 34c-6-4-9-7-9-11a4.5 4.5 0 0 1 9-1.5a4.5 4.5 0 0 1 9 1.5c0 4-3 7-9 11z"/><path d="M12 46h6l2-4 3 8 2-4h7"/></svg>' },
    "stack": { kind: "dest", name: "Grafana stack", desc: "Postgres and Grafana dashboards", chips: ["Docker Compose", "Helm"],
      art: '<svg class="icon" width="64" height="56" viewBox="0 0 64 56"><rect x="3" y="3" width="58" height="50" rx="6"/>' +
        '<path class="a" d="M11 40l13-14 10 9 19-19"/><path d="M11 46h18"/></svg>' },
    "ha": { kind: "dest", name: "Home Assistant", desc: "The integration: sensors and all your history", chips: ["Marketplace (HACS)"],
      art: '<svg class="icon" width="64" height="58" viewBox="0 0 64 58"><path d="M6 28L32 5l26 23"/><path d="M12 23v31h40V23"/>' +
        '<circle class="a" cx="32" cy="32" r="5"/><path class="a" d="M32 37v17"/></svg>' },
    "own-server": { kind: "dest own", name: "Your own server", desc: "MQTT or any webhook, such as n8n or Node-RED", chips: ["Guide on owen282000.com"],
      art: '<svg class="icon" width="64" height="56" viewBox="0 0 64 56"><rect x="3" y="6" width="58" height="18" rx="4"/><rect x="3" y="32" width="58" height="18" rx="4"/>' +
        '<circle class="af" cx="12" cy="15" r="1.6"/><circle class="af" cx="12" cy="41" r="1.6"/>' +
        '<path class="a" d="M40 11l-4 8M46 11l4 4-4 4M30 11l-4 4 4 4"/><path d="M24 41h28"/></svg>' },
    "sleep-card": { kind: "card", name: "Sleep card", desc: "One night, stage by stage",
      art: '<div class="rows">' + lane("#d29922", [["left", 6, 5], ["right", 8, 5]]) + lane("#e5566a", [["left", 40, 14], ["left", 92, 22]]) +
        lane("#4493f8", [["left", 10, 12], ["left", 58, 16], ["left", 112, 10]]) + lane("#7c6ff0", [["left", 24, 12], ["left", 74, 24]]) + '</div>' },
    "screen-time-card": { kind: "card", name: "Screen time cards", desc: "Today, the week and the family",
      art: '<div class="split"><div class="donut"></div><div class="bars">' +
        [["#e5566a", 92], ["#3fb950", 60], ["#4493f8", 45]].map(([c, w]) => '<div><i style="width:' + w + '%;background:' + c + '"></i></div>').join("") +
        '</div></div>' },
    "year-card": { kind: "card", name: "Year card", desc: "A year of any sensor, one square a day",
      art: '<div class="year">' + yearCells.map((v) => '<span style="background:var(--g' + v + ')"></span>').join("") + '</div>' },
    "activity-card": { kind: "card", name: "Activity card", desc: "Daily goals, the week and your streak",
      art: '<div class="rings"><div style="border-color:#3fb950;border-left-color:' + t + '"></div>' +
        '<div style="border-color:#e8833a;border-left-color:' + t + ';border-bottom-color:' + t + '"></div>' +
        '<div style="border-color:#8b6ff0;border-top-color:' + t + '"></div></div>' },
    "before-bed-card": { kind: "card", name: "Before bed card", desc: "Your phone in the last hour before sleep",
      art: '<div class="rows">' + night(4, 2, 8) + night(14, 1, 10) + night(4, 3, 4) + night(20, 1, 14) + '</div>' }
  };
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "light") document.body.classList.add("light");
  if (q.get("p") === "arrow") {
    document.getElementById("wrap").hidden = true;
    document.getElementById("arrow").hidden = false;
  } else {
    const p = parts[q.get("p")] || parts.android;
    document.getElementById("wrap").className = "wrap " + p.kind + (q.get("here") === "1" ? " here" : "");
    document.getElementById("name").textContent = p.name;
    document.getElementById("desc").textContent = p.desc;
    document.getElementById("art").innerHTML = p.art;
    const chips = document.getElementById("chips");
    if (p.chips) chips.innerHTML = p.chips.map((c) => "<span>" + c + "</span>").join(""); else chips.remove();
  }
</script>
</body>
</html>
