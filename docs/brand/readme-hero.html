<!DOCTYPE html>
<!--
  Source for docs/readme-hero.png, the first image in the README: the integration's example
  dashboard (docs/screenshots/home-assistant-dashboard.png) in the same card as the other
  README images, so the three read as one set in GitHub's light and dark theme. Drawn at
  twice the size it is shown at (900 px wide). Swap the screenshot and render again to
  update it.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=docs/readme-hero.png --window-size=1800,1040 \
      --hide-scrollbars --force-device-scale-factor=1 \
      --default-background-color=00000000 docs/brand/readme-hero.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1800px; height: 1040px; overflow: hidden; background: transparent; }
  .card {
    position: absolute; inset: 0; border-radius: 40px; overflow: hidden;
    background: radial-gradient(130% 130% at 25% 20%, #171D21 0%, #14181C 45%, #101C1C 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.5;
    background-image:
      linear-gradient(rgba(48,183,126,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,183,126,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .shot {
    position: absolute; left: 48px; top: 48px; width: 1704px; height: 944px;
    border-radius: 24px; overflow: hidden;
    border: 3px solid rgba(255,255,255,0.12);
    box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 0 0 10px rgba(255,255,255,0.025);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="shot"><img src="../screenshots/home-assistant-dashboard.png" alt=""></div>
</div>
</body>
</html>
