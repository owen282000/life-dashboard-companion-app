<!DOCTYPE html>
<!--
  Source for the repository banner (docs/social-preview.png, 1280x640, GitHub social preview size).

  Rendered with headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=docs/social-preview.png --window-size=1280,640 \
      --hide-scrollbars --force-device-scale-factor=1 docs/brand/banner.html

  Same identity as icon.html and feature-graphic.html: background #14181C -> #101C1C,
  heartbeat green #30B77E.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(130% 130% at 25% 20%, #171D21 0%, #14181C 45%, #101C1C 100%);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    position: relative; color: #fff;
  }
  .grid {
    position: absolute; right: 0; bottom: 0; width: 46%; height: 78%;
    background-image:
      linear-gradient(to right, rgba(48,183,126,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(48,183,126,0.06) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(100% 100% at 100% 100%, black 30%, transparent 78%);
  }
  .text { position: absolute; left: 84px; top: 96px; }
  h1 { font-size: 80px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; }
  h1 .accent { color: #30B77E; display: block; }
  .tagline { margin-top: 28px; font-size: 31px; color: #B9C2C6; font-weight: 400; }
  .kicker {
    position: absolute; left: 84px; bottom: 52px;
    font-size: 24px; font-weight: 700; color: #30B77E; letter-spacing: 0.2px;
  }
  .kicker .dim { color: #1E5C45; padding: 0 8px; }
  svg.beat { position: absolute; left: 62px; bottom: 122px; }

  .phone {
    position: absolute; right: 150px; top: 72px; width: 196px; height: 400px;
    border: 6px solid #3A4440; border-radius: 38px; background: #131A18;
    box-shadow: 0 0 80px rgba(48,183,126,0.10);
  }
  .phone .bar  { position: absolute; left: 30px; background: #35403C; border-radius: 5px; height: 11px; }
  .phone .b1 { top: 42px; width: 116px; }
  .phone .b2 { top: 68px; width: 76px; }
  .phone .home { position: absolute; bottom: 18px; left: 50%; width: 19px; height: 19px;
    border: 4px solid #3A4440; border-radius: 50%; transform: translateX(-50%); }
  .phone svg { position: absolute; left: 0; top: 160px; }

  .server {
    position: absolute; right: 52px; bottom: 168px; width: 92px; height: 120px;
    border: 5px solid rgba(48,183,126,0.35); border-radius: 15px;
  }
  .server i { position: absolute; left: 15px; width: 9px; height: 9px; border-radius: 50%;
    background: #30B77E; opacity: 0.75; }
  .server i:nth-child(1) { top: 19px; } .server i:nth-child(2) { top: 50px; } .server i:nth-child(3) { top: 81px; }
  .server s { position: absolute; left: 34px; right: 15px; height: 8px; border-radius: 4px;
    background: rgba(48,183,126,0.30); }
  .server s:nth-child(4) { top: 19px; } .server s:nth-child(5) { top: 50px; } .server s:nth-child(6) { top: 81px; }
  .bars { position: absolute; right: 188px; bottom: 56px; display: flex; align-items: flex-end; gap: 15px; }
  .bars b { width: 28px; background: #1E5C45; border-radius: 5px; display: block; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="text">
    <h1>Life Dashboard<span class="accent">Companion</span></h1>
    <div class="tagline">Your health data, your server. No cloud.</div>
  </div>

  <svg class="beat" width="620" height="150" viewBox="0 0 620 150">
    <defs>
      <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#glow)">
      <path d="M22 78 L250 78 L282 28 L315 122 L340 55 L360 78 L540 78"
            fill="none" stroke="#30B77E" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="540" cy="78" r="11" fill="#30B77E"/>
    </g>
  </svg>

  <div class="phone">
    <span class="bar b1"></span><span class="bar b2"></span>
    <svg width="184" height="88" viewBox="0 0 184 88">
      <path d="M22 45 L72 45 L87 18 L104 70 L117 38 L127 45 L162 45"
            fill="none" stroke="#30B77E" stroke-width="5.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="home"></span>
  </div>

  <div class="server"><i></i><i></i><i></i><s></s><s></s><s></s></div>
  <div class="bars">
    <b style="height:28px"></b><b style="height:48px"></b><b style="height:38px"></b>
    <b style="height:65px"></b><b style="height:53px"></b><b style="height:80px"></b>
  </div>

  <div class="kicker">Android <span class="dim">|</span> Health Connect + Screen Time <span class="dim">&rarr;</span> Webhooks + MQTT</div>
</body>
</html>
