<!DOCTYPE html>
<!--
  Source for the Play feature graphic, 1024x500, rendered per language by
  docs/brand/play-panorama/render.sh into store-assets/feature-<lang>.png; docs/brand/render-store.sh
  copies en, nl and de into fastlane. ?lang= picks the line; the labels are names and stay as they
  are, also in Arabic, where the row runs right to left.

  The panorama's look: ground #0A0F0D, accent #30B77E, Space Grotesk, the app's heartbeat line, which
  splits into its three kinds of receiver, side by side. An opaque body, so render.sh can give an
  RGB PNG without alpha, as Play asks. Everything that matters stays inside the central 924x400;
  no logos. Scripts Space Grotesk has no glyphs for use a system font of this Mac, as in the panorama.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url(../../app/src/main/res/font/space_grotesk_medium.ttf); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(../../app/src/main/res/font/space_grotesk_bold.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --script: sans-serif; }
  :lang(ja) { --script: "Hiragino Sans"; }
  :lang(zh-CN) { --script: "PingFang SC"; }
  :lang(ar) { --script: "SF Arabic"; }
  :lang(hi) { --script: "Kohinoor Devanagari"; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: #0A0F0D; }
  body { position: relative; color: #EEF4F0; font-family: "Space Grotesk", var(--script), sans-serif; }
  .glow { position: absolute; left: 330px; top: 60px; width: 620px; height: 440px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(48,183,126,0.18), rgba(48,183,126,0)); }
  h1 { position: absolute; left: 56px; top: 48px; width: 912px; font-weight: 700; line-height: 1.1; letter-spacing: -0.017em; white-space: nowrap; }
  h1 span { display: block; width: max-content; }
  h1 em { font-style: normal; color: #30B77E; }
  [dir=rtl] h1 span { margin-inline-start: 0; }
  :lang(ar) h1, :lang(hi) h1 { letter-spacing: 0; line-height: 1.25; }
  :lang(ja) h1, :lang(zh-CN) h1 { letter-spacing: 0; line-height: 1.2; }
  svg { position: absolute; left: 0; top: 0; }
  .card {
    position: absolute; width: 268px; height: 64px; border-radius: 18px; display: flex; align-items: center; padding: 0 24px;
    font-size: 27px; font-weight: 500; white-space: nowrap; direction: ltr;
    background: #141C18; border: 2px solid #27332D;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <h1 id="line"></h1>
  <svg id="flow" width="1024" height="500" viewBox="0 0 1024 500">
    <g id="lines" fill="none" stroke="#30B77E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 330 H250 l14 -33 l22 66 l19 -48 l9 15 H420"/>
      <path d="M420 330 C 520 330, 500 254, 620 254 H690"/>
      <path d="M420 330 H690"/>
      <path d="M420 330 C 520 330, 500 406, 620 406 H690"/>
    </g>
    <circle id="dot" cx="420" cy="330" r="10" fill="#30B77E"/>
  </svg>
  <div id="cards"></div>
<script>
// The line per language, as panel 1 of the panorama.
const LINES = {
  en: ["Your health data,", "on your own server"],
  nl: ["Je gezondheidsdata,", "op je eigen server"],
  de: ["Deine Gesundheitsdaten,", "auf deinem Server"],
  fr: ["Vos données de santé,", "sur votre serveur"],
  es: ["Tus datos de salud,", "en tu propio servidor"],
  it: ["I tuoi dati sulla salute,", "sul tuo server"],
  "pt-BR": ["Seus dados de saúde,", "no seu próprio servidor"],
  ja: ["健康データを、", "あなたのサーバーへ"],
  ar: ["بياناتك الصحية،", "على خادمك الخاص"],
  hi: ["आपका स्वास्थ्य डेटा,", "आपके अपने सर्वर पर"],
  "zh-CN": ["您的健康数据，", "发送到您自己的服务器"],
};
const WEBHOOK = { hi: "वेबहुक" };
const lang = new URLSearchParams(location.search).get("lang") || "en";
const rtl = lang === "ar";
document.documentElement.lang = lang;
if (rtl) {
  document.documentElement.dir = "rtl";
  document.getElementById("lines").setAttribute("transform", "translate(1024 0) scale(-1 1)");
  document.getElementById("dot").setAttribute("cx", 1024 - 420);
}
const h1 = document.getElementById("line");
const [a, b] = LINES[lang] || LINES.en;
h1.innerHTML = `<span>${a}</span><span><em>${b}</em></span>`;
const left = rtl ? 1024 - 690 - 268 : 690;
document.getElementById("cards").innerHTML = ["Home Assistant", WEBHOOK[lang] || "Webhook", "MQTT"]
  .map((name, n) => `<div class="card" style="left:${left}px;top:${222 + n * 76}px">${name}</div>`).join("");
document.fonts.ready.then(() => {
  const max = 64;
  h1.style.fontSize = max + "px";
  const widest = Math.max(...[...h1.children].map((line) => line.getBoundingClientRect().width));
  h1.style.fontSize = Math.floor(Math.min(max, max * 900 / widest)) + "px";
});
</script>
</body>
</html>
