<!DOCTYPE html>
<!--
  Source for the store feature graphic (fastlane/metadata/android/en-US/images/featureGraphic.png).

  Rendered with headless Chrome, the same way docs/social-preview.png was made:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=fastlane/metadata/android/en-US/images/featureGraphic.png \
      --window-size=1024,500 --hide-scrollbars --force-device-scale-factor=1 \
      "file://$PWD/docs/brand/feature-graphic.html"

  The opaque body gives an RGB PNG without alpha, as Play asks. Same identity as the icon and
  the store screenshots: heartbeat green #30B77E on a dark green-tinted gradient (Play advises
  against plain dark gray), white title with the green "Companion". Everything that matters
  stays inside the central 924x400; the destinations are text only, no logos.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 20% 20%, #15402F 0%, #0F2A21 45%, #0A1A16 100%);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; position: relative; color: #fff;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(48,183,126,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(48,183,126,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(70% 90% at 82% 55%, black 20%, transparent 80%);
  }
  .glow { position: absolute; right: 80px; top: 40px; width: 460px; height: 420px;
    background: radial-gradient(closest-side, rgba(48,183,126,0.16), transparent); }

  svg.mark { position: absolute; left: 50px; top: 66px; }
  .text { position: absolute; left: 64px; top: 168px; }
  h1 { font-size: 58px; font-weight: 800; letter-spacing: -1px; line-height: 1.03; }
  h1 .accent { color: #30B77E; display: block; }
  .tagline { margin-top: 20px; font-size: 26px; line-height: 1.35; color: #C9D3D6; }

  .phone {
    position: absolute; left: 566px; top: 86px; width: 164px; height: 328px;
    border: 5px solid #3D4A45; border-radius: 30px; background: #0F1A17;
    box-shadow: 0 0 60px rgba(48,183,126,0.14);
  }
  .phone .bar { position: absolute; left: 24px; background: #2F3B37; border-radius: 4px; height: 9px; }
  .phone .b1 { top: 36px; width: 96px; } .phone .b2 { top: 56px; width: 62px; }
  .phone svg { position: absolute; left: 0; top: 130px; }
  .phone .home { position: absolute; bottom: 14px; left: 50%; width: 40px; height: 5px; border-radius: 3px;
    background: #3D4A45; transform: translateX(-50%); }

  svg.links { position: absolute; left: 0; top: 0; }
  .pill {
    position: absolute; left: 782px; width: 188px; height: 58px; border-radius: 29px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: 700; white-space: nowrap; color: #E8EDEF; letter-spacing: 0.1px;
    background: rgba(16,30,26,0.92); border: 2px solid rgba(255,255,255,0.14);
  }
  .pill.ha { border-color: rgba(48,183,126,0.75); box-shadow: 0 0 26px rgba(48,183,126,0.25); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <svg class="mark" width="190" height="84" viewBox="0 0 500 220">
    <defs>
      <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
        <feGaussianBlur stdDeviation="9" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#glow)">
      <path d="M30 110 L150 110 L184 30 L236 190 L270 80 L296 110 L340 110"
            fill="none" stroke="#30B77E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="340" cy="110" r="19" fill="#30B77E"/>
      <path d="M388 74 A 52 52 0 0 1 388 146" fill="none" stroke="#30B77E" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
      <path d="M422 46 A 92 92 0 0 1 422 174" fill="none" stroke="#30B77E" stroke-width="18" stroke-linecap="round" opacity="0.5"/>
    </g>
  </svg>

  <div class="text">
    <h1>Life Dashboard<span class="accent">Companion</span></h1>
    <div class="tagline">Your health data, your server.<br>No cloud.</div>
  </div>

  <div class="phone">
    <span class="bar b1"></span><span class="bar b2"></span>
    <svg width="154" height="70" viewBox="0 0 154 70">
      <path d="M16 36 L56 36 L68 14 L82 56 L92 30 L100 36 L120 36"
            fill="none" stroke="#30B77E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="122" cy="36" r="5" fill="#30B77E"/>
    </svg>
    <span class="home"></span>
  </div>

  <!-- From the phone's pulse to the three destinations. -->
  <svg class="links" width="1024" height="500" viewBox="0 0 1024 500">
    <g fill="none" stroke="#30B77E" stroke-width="3.5" stroke-linecap="round">
      <path d="M730 250 C 758 250, 754 155, 782 155" opacity="0.9"/>
      <path d="M730 250 L 782 250" opacity="0.9"/>
      <path d="M730 250 C 758 250, 754 345, 782 345" opacity="0.9"/>
    </g>
    <circle cx="730" cy="250" r="6" fill="#30B77E"/>
  </svg>
  <div class="pill ha" style="top:126px">Home Assistant</div>
  <div class="pill" style="top:221px">MQTT</div>
  <div class="pill" style="top:316px">Webhook</div>
</body>
</html>
