<!DOCTYPE html>
<!--
  Source for the store feature graphic (fastlane/metadata/android/en-US/images/featureGraphic.png),
  1024x500, rendered by docs/brand/render-store.sh with headless Chrome.

  Generic outlines of a watch, a ring and a scale (no real product) feed a small Health Connect
  node, which feeds the three destinations: Home Assistant, MQTT and Webhook. One line of text.
  The opaque body gives an RGB PNG without alpha, as Play asks. Same identity as the icon and
  the store screenshots: heartbeat green #30B77E on a dark green-tinted gradient. Everything
  that matters stays inside the central 924x400; no logos.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 20% 20%, #15402F 0%, #0F2A21 45%, #0A1A16 100%);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; position: relative; color: #fff;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(48,183,126,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(48,183,126,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(80% 90% at 60% 60%, black 20%, transparent 80%);
  }
  .glow { position: absolute; left: 380px; top: 120px; width: 420px; height: 360px;
    background: radial-gradient(closest-side, rgba(48,183,126,0.18), transparent); }

  h1 { position: absolute; left: 70px; right: 70px; top: 58px; text-align: center;
    font-size: 50px; font-weight: 800; letter-spacing: -0.8px; }
  h1 em { font-style: normal; color: #30B77E; }

  svg.flow { position: absolute; left: 0; top: 0; }
  .node {
    position: absolute; left: 404px; top: 268px; width: 200px; height: 64px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 23px; font-weight: 700; color: #E8EDEF;
    background: rgba(16,30,26,0.95); border: 2px solid rgba(48,183,126,0.75);
    box-shadow: 0 0 34px rgba(48,183,126,0.28);
  }
  .card {
    position: absolute; left: 700px; width: 230px; height: 66px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; font-weight: 700; color: #E8EDEF; white-space: nowrap;
    background: rgba(16,30,26,0.92); border: 2px solid rgba(255,255,255,0.16);
  }
  .card.ha { border-color: rgba(48,183,126,0.75); box-shadow: 0 0 26px rgba(48,183,126,0.22); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <h1>Your health data, on <em>your own server.</em></h1>

  <svg class="flow" width="1024" height="500" viewBox="0 0 1024 500">
    <g fill="none" stroke="#C9D3D6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <!-- A generic watch -->
      <rect x="136" y="170" width="62" height="70" rx="16"/>
      <path d="M150 170 L154 148 L180 148 L184 170 M150 240 L154 262 L180 262 L184 240"/>
      <path d="M167 190 L167 206 L178 214" stroke="#30B77E"/>
      <!-- A generic ring -->
      <ellipse cx="167" cy="320" rx="32" ry="24"/>
      <ellipse cx="167" cy="320" rx="22" ry="15"/>
      <!-- A generic scale -->
      <rect x="128" y="372" width="78" height="62" rx="14"/>
      <rect x="148" y="384" width="38" height="16" rx="4"/>
    </g>
    <g fill="none" stroke="#30B77E" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <path d="M220 205 C 320 205, 320 300, 404 300"/>
      <path d="M220 320 C 300 320, 320 300, 404 300"/>
      <path d="M220 403 C 320 403, 320 300, 404 300"/>
      <path d="M604 300 C 650 300, 650 215, 700 215"/>
      <path d="M604 300 L 700 300"/>
      <path d="M604 300 C 650 300, 650 385, 700 385"/>
    </g>
    <circle cx="404" cy="300" r="5" fill="#30B77E"/>
    <circle cx="604" cy="300" r="5" fill="#30B77E"/>
  </svg>

  <div class="node">Health Connect</div>
  <div class="card ha" style="top:182px">Home Assistant</div>
  <div class="card" style="top:267px">MQTT</div>
  <div class="card" style="top:352px">Webhook</div>
</body>
</html>
