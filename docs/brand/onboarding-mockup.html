<!DOCTYPE html>
<!--
  Local look-and-feel playground for the first-run wizard and the Health tab.
  Not part of the app: pick what works here, then port it to OnboardingScreen.kt.
  Open in a browser: open docs/brand/onboarding-mockup.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding mockup</title>
<style>
  :root {
    --accent: #10B981;
    --accent-ink: #FFFFFF;
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;
    --text: #1F2937;
    --muted: #6B7280;
    --line: #D1D5DB;
    --hair: #E5E9EF;
    --error: #EF4444;
    --radius-card: 14px;
    --radius-btn: 999px;
    --card-fill-alpha: 0;
    --font: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --shadow-card: none;
    --shadow-btn: none;
  }
  .dark {
    --bg: #0D1117;
    --surface: #161B22;
    --surface-2: #1E2530;
    --text: #E6EDF3;
    --muted: #9AA4B2;
    --line: #3A4450;
    --hair: #242C36;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9ECEF; font-family: var(--font); color: #111; }

  /* Controls */
  .controls {
    position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #d8dde3;
    padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; font-size: 13px;
  }
  .controls label { display: flex; align-items: center; gap: 6px; }
  .controls .group { display: flex; align-items: center; gap: 8px; }
  .controls .group b { font-weight: 600; margin-right: 2px; }
  .controls .group.hi { background: #FFF7D6; padding: 4px 10px; border-radius: 8px; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch.on { border-color: #111; }
  .controls select, .controls input[type=range] { font: inherit; }

  /* Phones */
  .gallery { display: flex; gap: 28px; padding: 28px 20px 60px; overflow-x: auto; align-items: flex-start; }
  .phone-wrap { flex: 0 0 auto; text-align: center; }
  .phone-wrap h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: #555; }
  .phone {
    width: 360px; height: 780px; border-radius: 34px; border: 8px solid #2B3136; background: var(--bg);
    color: var(--text); overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex; flex-direction: column; font-family: var(--font); text-align: left;
  }
  .align-center .phone .wiz { text-align: center; }
  .align-center .phone .wiz .card .head { justify-content: center; }
  .align-center .phone .wiz .card .t { justify-content: center; }
  .card .head { display: flex; align-items: center; gap: 14px; }
  .card .txt { flex: 1 1 auto; min-width: 0; }
  .align-center .phone .wiz .row { justify-content: center; }
  .statusbar { height: 34px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    padding: 0 22px; font-size: 12px; color: var(--muted); }
  .screen { flex: 1 1 auto; overflow-y: auto; padding: 0 24px 16px; display: flex; flex-direction: column; position: relative; }

  /* Wizard */
  .dots { display: flex; justify-content: center; gap: 8px; padding: 22px 0 22px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); }
  .dot.done { background: var(--accent); }
  .dot.now { width: 10px; height: 10px; background: var(--accent); }
  .dots.bar .dot, .dots.bar .dot.now { width: 34px; height: 4px; border-radius: 2px; }
  .steplabel { display: none; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 14px; font-weight: 700; letter-spacing: -0.3px; }
  h2 { font-size: 23px; line-height: 1.2; margin: 0 0 12px; font-weight: 700; }
  p.lead { font-size: 16px; line-height: 1.45; color: var(--muted); margin: 0 0 14px; }
  p.body { font-size: 14px; line-height: 1.45; color: var(--muted); margin: 0 0 14px; }
  .content { flex: 1 1 auto; }
  .hero { display: flex; justify-content: center; padding: 14px 0 26px; position: relative; }
  .hero svg { width: 150px; height: 84px; position: relative; }

  .card {
    border-radius: var(--radius-card); background: var(--surface); padding: 16px; margin-bottom: 14px;
    border: 2px solid transparent; cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s;
    box-shadow: var(--shadow-card);
  }
  .card.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) calc(var(--card-fill-alpha) * 100%), var(--surface)); }
  .style-outlined .card { border-color: var(--line); }
  .style-outlined .card.on { border-color: var(--accent); }
  .card .t { font-size: 16px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .card .d { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .card .body { margin-top: 12px; display: none; text-align: left; }
  .card.on .body { display: block; }
  .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: 0 0 auto; position: relative; }
  .card.on .radio { border-color: var(--accent); }
  .card.on .radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
  .no-radio .radio { display: none; }
  .ico { display: none; }

  .field { position: relative; margin: 10px 0; }
  .field input { width: 100%; padding: 15px 14px; font: inherit; font-size: 15px; border: 1px solid var(--line);
    border-radius: 6px; background: transparent; color: var(--text); outline: none; }
  .field input:focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .field label { position: absolute; left: 10px; top: -8px; background: var(--surface); padding: 0 4px; font-size: 12px; color: var(--muted); }
  .card.on .field label { background: color-mix(in srgb, var(--accent) calc(var(--card-fill-alpha) * 100%), var(--surface)); }
  .field input:focus + label { color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.4; margin: 6px 0 10px; }

  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: var(--radius-btn); border: 0; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-btn); }
  .btn.text { background: transparent; color: var(--accent); padding-left: 8px; }
  .btn.outline { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 9px 18px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; flex: 0 0 auto; }
  .ping { font-size: 12px; margin-left: 12px; }
  .ping.ok { color: var(--accent); } .ping.bad { color: var(--error); }

  .switch { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; cursor: pointer; flex: 0 0 auto; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--accent); } .switch.on::after { left: 21px; }

  .checklist { display: none; }

  /* Main screen */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 12px; }
  .topbar b { font-size: 20px; }
  .banner { margin: 0 -24px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 80%, #fff)); color: #fff;
    padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .banner .bt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .banner .bt b { font-size: 15px; }
  .banner .bt span { font-size: 12px; opacity: .92; }
  .banner .chip.cta { background: #fff; color: var(--accent); }
  .st .banner .chip.cta { color: #7C3AED; }
  .premium .warn { display: none; }
  .banner .chip { background: rgba(255,255,255,.22); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: 0 0 auto; margin-left: 10px; }
  .stats { display: flex; justify-content: space-between; padding: 18px 8px 6px; }
  .stats { gap: 10px; } .stats > div { min-width: 0; }
  .stats .s { font-size: 12px; color: var(--muted); white-space: nowrap; } .stats .v { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .logrow .t, .logrow .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logrow .l > div { min-width: 0; }
  .logsb { background: linear-gradient(90deg, #2F80ED, #7FB4FF); }
  .premium .logsb { box-shadow: 0 8px 20px -8px rgba(47,128,237,.6); }
  .logsb .switch { background: rgba(255,255,255,.3); }
  .logsb .switch.on { background: #fff; } .logsb .switch.on::after { background: #2F80ED; }
  .banner .switch { background: rgba(255,255,255,.35); margin-left: 10px; }
  .banner .switch.on { background: #fff; } .banner .switch.on::after { background: #0F766E; }
  .logrow .code { font-size: 11px; padding: 4px 8px; }
  .logrow .code { margin-left: auto; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent); white-space: nowrap; }
  .logrow .code.bad { background: color-mix(in srgb, var(--error) 12%, var(--surface)); color: var(--error); }
  .logrow .code.warnc { background: #FEF3C7; color: #B45309; }
  .premium .logrow .ico2.bad { background: color-mix(in srgb, var(--error) 12%, var(--surface)); color: var(--error); }
  .premium .logrow .ico2.warnc { background: #FEF3C7; color: #B45309; }
  .stats .appicon { width: 22px; height: 22px; border-radius: 6px; overflow: hidden; display: inline-flex; vertical-align: -3px; margin-right: 6px; }
  .stats .appicon svg { width: 22px; height: 22px; }
  .topapprow { display: flex; align-items: center; gap: 12px; padding: 12px 8px 14px; }
  .topapprow .appicon { width: 32px; height: 32px; border-radius: 9px; overflow: hidden; display: inline-flex; flex: 0 0 auto; }
  .topapprow .appicon svg { width: 32px; height: 32px; }
  .topapprow .t { font-size: 15px; font-weight: 600; } .topapprow .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .topapprow .lbl { margin-left: auto; font-size: 12px; color: var(--muted); }
  .premium .stats + .topapprow { background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 12px 16px; margin: -4px 0 12px; box-shadow: var(--shadow-card); }
  .stats .v.topapp { font-size: 20px; }
  .stats .appicon { width: 22px; height: 22px; border-radius: 6px; overflow: hidden; flex: 0 0 auto; display: inline-flex; }
  .stats .appicon svg { width: 22px; height: 22px; }
  .stats .v .trunc { display: inline-block; max-width: 96px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .stats .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .warn { margin: 14px 0; background: #FEE2E2; color: #B91C1C; border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; }
  .dark .warn { background: #4A1515; color: #FCA5A5; }
  .sect { padding: 16px 8px; display: flex; justify-content: space-between; align-items: center; }
  .sect .t { font-size: 15px; font-weight: 600; } .sect .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .sect .sub.acc { color: var(--accent); }
  .chev { color: var(--muted); }
  .nav { margin: auto -24px 0; background: var(--surface-2); display: flex; justify-content: space-around; padding: 10px 0 12px; flex: 0 0 auto; }
  .nav div { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 20px; border-radius: 16px; }
  .nav div.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface-2)); font-weight: 600; }
  .nav i { display: block; font-style: normal; font-size: 18px; margin-bottom: 2px; }

  /* ===== Premium variant ===== */
  .premium {
    --radius-card: 20px;
    --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 10px 30px -12px rgba(16,24,40,.16);
    --shadow-btn: 0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .premium.dark { --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -12px rgba(0,0,0,.6); }
  .premium .screen.wiz::before {
    content: ""; position: absolute; left: -60px; right: -60px; top: -140px; height: 340px; pointer-events: none;
    background: radial-gradient(60% 60% at 50% 30%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 70%);
  }
  .premium .dots { padding: 26px 0 8px; gap: 6px; }
  .premium .dots.bar .dot, .premium .dots.bar .dot.now { width: 44px; height: 5px; border-radius: 3px; }
  .premium .dot { background: color-mix(in srgb, var(--text) 10%, transparent); }
  .premium .dot.done, .premium .dot.now { background: var(--accent); }
  .premium .steplabel { display: block; text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; font-weight: 600; }
  .premium h1 { font-size: 31px; letter-spacing: -0.6px; line-height: 1.1; margin-bottom: 14px; }
  .premium h2 { font-size: 25px; letter-spacing: -0.4px; margin-bottom: 10px; }
  .premium p.lead, .premium p.body { line-height: 1.5; }
  .premium p.body { margin-bottom: 18px; }
  .premium .hero { padding: 26px 0 30px; }
  .premium .hero::before { content: ""; position: absolute; width: 150px; height: 150px; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); }
  .premium .card { border: 1px solid var(--hair); padding: 18px; margin-bottom: 12px; }
  .premium .card.on { border-color: var(--accent); box-shadow: var(--shadow-card), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .premium .card .t { font-size: 16px; margin-bottom: 4px; }
  .premium .ico { display: inline-flex; width: 40px; height: 40px; border-radius: 13px; align-items: center; justify-content: center; flex: 0 0 auto;
    background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent); }
  .premium .ico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Cards keep the standard row layout even when the headings are centred: icon, title, radio on the right. */
  .premium .card, .align-center.premium .wiz .card { text-align: left; }
  .align-center.premium .wiz .card .head, .align-center.premium .wiz .card .t { justify-content: flex-start; }
  .premium .card.on .ico { background: var(--accent); color: #fff; box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
  .premium .radio { order: 9; margin-left: auto; }
  .premium .field input { background: var(--surface-2); border-color: transparent; border-radius: 12px; padding: 16px 14px; }
  .premium .field input:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .premium .field label { background: transparent; top: -18px; left: 4px; font-weight: 500; }
  .premium .card.on .field label { background: transparent; }
  .premium .field { margin: 26px 0 12px; }
  .premium .btn { padding: 14px 22px; font-size: 15px; white-space: nowrap; }
  .premium .btn.text { padding-left: 6px; padding-right: 10px; }
  .premium .btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); }
  .premium .btn.outline { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .premium .footer { padding-top: 20px; }
  .premium .checklist { display: block; margin-top: 8px; text-align: left; }
  .premium .checklist .item { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-card); }
  .premium .checklist .n { width: 28px; height: 28px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .premium .checklist .t { font-size: 14px; font-weight: 600; } .premium .checklist .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .premium .donemark { width: 72px; height: 72px; border-radius: 50%; margin: 18px auto 22px; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 6%, transparent); }
  .premium .donemark svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .donemark { display: none; } .premium .donemark { display: flex; }
  .premium .summary { display: block; }
  .summary { display: none; }
  /* Health tab in premium */
  .premium .banner { margin: 0 0 4px; border-radius: 18px; box-shadow: var(--shadow-btn); }
  .premium .warn { border-radius: 18px; }
  .premium .sect { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-card); }
  .premium .nav { background: var(--surface); border-top: 1px solid var(--hair); }

  /* ===== Main screens ===== */
  .gallery h2.rowtitle { display: none; }
  .rowhead { padding: 6px 20px 0; font-size: 14px; font-weight: 700; color: #444; }
  .rowhead small { font-weight: 400; color: #777; margin-left: 8px; }
  .main { padding-bottom: 0; }
  .main .body-scroll { flex: 1 1 auto; overflow-y: auto; margin: 0 -24px; padding: 0 20px 20px; }
  .main .topbar { padding: 12px 4px 10px; }
  .st { --accent: #8B5CF6; }
  .lg { --accent: #2F80ED; }
  .lg .nav div.on { color: #2F80ED; background: color-mix(in srgb, #2F80ED 16%, var(--surface-2)); }
  .logrow .code.ok { background: #DCFCE7; color: #166534; }
  .dark .logrow .code.ok { background: #14532D; color: #BBF7D0; }
  .st .banner { background: linear-gradient(90deg, #7C3AED, #A78BFA); }
  .st .nav div.on { color: #7C3AED; background: color-mix(in srgb, #8B5CF6 18%, var(--surface-2)); }
  .sect.act { justify-content: flex-start; gap: 12px; }
  .sect .ico2 { display: none; }
  .sect .r { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .urlrow { display: flex; gap: 10px; align-items: center; padding: 0 8px 12px; }
  .urlrow input { flex: 1; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 14px; }
  .urlrow .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .actions { padding: 8px 8px 4px; display: flex; flex-direction: column; gap: 10px; }
  .actions .btn { width: 100%; border-radius: 12px; padding: 14px; font-size: 15px; }
  .actions .btn.primary.dim { background: var(--surface-2); color: var(--muted); box-shadow: none; }
  .actions .btn.outline { border-radius: 12px; border-color: var(--hair); color: var(--muted); }
  .foot { font-size: 13px; color: var(--muted); padding: 14px 8px 8px; }
  .chips { display: flex; gap: 10px; padding: 8px 4px 14px; }
  .chip2 { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .chip2.on { background: #FFCCBC; color: #E64A19; border-color: transparent; font-weight: 600; }
  .krow { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 14px; }
  .krow .t { font-size: 15px; } .krow .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .overview { background: var(--surface-2); border-radius: 14px; padding: 16px; }
  .overview .h { font-weight: 700; font-size: 15px; margin-bottom: 14px; }
  .overview .nums { display: flex; justify-content: space-around; text-align: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .overview .nums b { display: block; font-size: 24px; } .overview .nums span { font-size: 12px; color: var(--muted); }
  .overview .split { display: flex; justify-content: space-between; font-size: 13px; }
  .overview .split b { display: block; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 16px; }
  .logitem { display: none; }
  .grouplabel { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 6px 8px; }
  .premium .ico2.stc { background: #EDE9FE; color: #8B5CF6; }
  .abouthero { margin: 0 -20px; background: linear-gradient(180deg, #00897B, #00695C); color: #fff; text-align: center; padding: 34px 20px 30px; }
  .abouthero .disc { width: 88px; height: 88px; border-radius: 50%; background: rgba(255,255,255,.18); margin: 0 auto 22px; display: flex; align-items: center; justify-content: center; }
  .abouthero .disc svg { width: 40px; height: 40px; }
  .abouthero h1 { font-size: 30px; margin: 0; color: #fff; }

function dots(key) {
  const keys = stepKeys(), step = keys.indexOf(key), total = keys.length;
  return `<div class="dots ${document.getElementById('dotstyle').value}">` +
    keys.map((k, i) => `<div class="dot ${i < step ? 'done' : ''} ${i === step ? 'now' : ''}"></div>`).join('') + `</div>` +
    `<div class="steplabel">${t('step').replace('%1', step + 1).replace('%2', total)}</div>`;
}
function phone(title, inner, cls = "") {

  github: `<svg viewBox="0 0 24 24"><path d="M9 19c-4.5 1.5-4.5-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.7 11.7 0 0 0-6.2 0C6.5 2.8 5.5 3.1 5.5 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>`,
  coffee: `<svg viewBox="0 0 24 24"><path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2M7 4v2M11 4v2"/></svg>`,
  save: `<svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v5h8V4M8 20v-6h8v6"/></svg>`,
};
const sect = (ico, title, sub, right = `<span class="chev">⌄</span>`, subCls = "", toggle = "") =>
  `<div class="sect" ${toggle ? `data-toggle="${toggle}"` : ''}><div class="l"><span class="ico2">${I2[ico]}</span><div><div class="t">${title}</div>${sub ? `<div class="sub ${subCls}">${sub}</div>` : ''}</div></div>${right}</div>`;
const navbar = (on) => `<div class="nav"><div class="${on === 'h' ? 'on' : ''}"><i>♥</i>${t('nav_h')}</div><div class="${on === 's' ? 'on' : ''}"><i>▯</i>${t('nav_s')}</div><div class="${on === 'l' ? 'on' : ''}"><i>⟲</i>${t('nav_l')}</div></div>`;
const mainPhone = (title, cls, inner, nav) =>
  `<div class="phone-wrap"><h3>${title}</h3><div class="phone ${cls}"><div class="statusbar"><span>12:34</span><span>▾ ◢ ▮</span></div><div class="screen main">${inner}${nav || ''}</div></div></div>`;

// ?bottom in the URL scrolls every main screen to its end (handy for headless screenshots)
const scrollbottom = () => { if (location.search.includes('bottom')) document.querySelectorAll('.body-scroll').forEach(el => el.scrollTop = el.scrollHeight); };
function renderMain() {
  const count = S.preset === 'all' ? 33 : S.preset === 'ess' ? 8 : 0;
  const hooks = S.webhook && S.url.trim() ? 1 : 0;
  const mqttSub = S.mqtt ? m('mqtt_on').replace('%1', S.host.trim() || 'broker') : m('mqtt_off');
  const urlBlock = `<div class="urlrow"><input placeholder="https://..."><span class="plus">+</span></div>`;
  const actGrid = (items) => `<div class="actgrid">${items.map(([ico, label]) => `<button class="btn outline grid">${I2[ico]}${label}</button>`).join('')}</div>`;
  const actList = (items) => items.map(([ico, label]) => `<button class="btn outline">${label}</button>`).join('');

  const health = mainPhone(t('hc'), "", `
    <div class="topbar"><span style="width:24px"></span><b>${t('hc')}</b><span class="chev">ⓘ</span></div>
    <div class="body-scroll">
      <div class="banner"><div class="bt"><b>${t('hc')}</b><span>${S.hcPerm ? `${count} ${t('selected')}` : m('hc_perm_sub')}</span></div>
        <span class="chip ${S.hcPerm ? '' : 'cta'}" data-toggle="hcPerm">${S.hcPerm ? t('openapp') + ' ↗' : m('hc_perm_btn')}</span></div>
      <div class="stats"><div><div class="s">${t('today')}</div><div class="v">0<small>${t('records')}</small></div></div><div><div class="s">${t('lifetime')}</div><div class="v">0<small>${t('records')}</small></div></div><div><div class="s">${t('lastsync')}</div><div class="v" style="font-size:16px">● ${t('never')}</div></div></div>
      ${S.hcPerm ? '' : `<div class="warn"><span>⚠ ${t('perm')}</span><span>${t('grant')}</span></div>`}
      <div class="group">
        ${sect('types', t('dtypes'), `${count} ${t('of33')}`, `<span class="chev">⌄</span>`, 'acc')}
        ${sect('clock', t('interval'), t('mins'), `<b>60</b>`)}
      </div>
      <div class="group">
        ${sect('link', t('webhook'), `${hooks} ${t('configured')}`, `<span class="chev ${S.whOpenH ? 'open' : ''}">⌄</span>`, hooks ? 'acc' : '', 'whOpenH')}
        ${S.whOpenH ? `<div class="inner">${urlBlock}<div class="subrow"><span>${t('headers')}</span><span>${t('nonecfg')}</span></div></div>` : ''}
        ${sect('home', m('mqtt_t'), mqttSub, `<span class="chev">⌄</span>`, S.mqtt ? 'acc' : '')}
      </div>
      <div class="group">
        ${sect('tune', t('adv'), t('advsub'))}
        ${sect('bell', m('notif'), m('notif_sub'), `<span class="chev">⌄</span>`, 'acc')}
      </div>
      <div class="sect manualrow" style="padding:6px 8px"><div class="t">${m('manual')}</div><div class="sub">${m('syncnow_s')}</div></div>
      <div class="actions">
        <button class="btn primary ${count ? '' : 'dim'}">${m('syncnow')}</button>
        ${actList([['eye', m('preview')], ['send', t('ping')], ['share', m('export')], ['history', m('backfill')]])}
        ${actGrid([['eye', m('prev_s')], ['send', m('ping_s')], ['share', m('export_s')], ['history', m('backfill_s')]])}
      </div>
      <div class="foot">${m('syncing').replace('%1', hooks)}</div>
    </div>`, navbar('h'));

  const screen = mainPhone(t('st'), "st", `
    <div class="topbar"><span style="width:24px"></span><b>${t('st')}</b><span class="chev">ⓘ</span></div>
    <div class="body-scroll">
      <div class="banner"><div class="bt"><b>${m('st_banner')}</b><span>${S.stPerm ? m('st_ok_sub') : m('st_perm_sub')}</span></div>
        ${S.stPerm ? `<span class="chip" data-toggle="stPerm">${m('settings')} ↗</span>` : `<span class="chip cta" data-toggle="stPerm">${m('st_perm_btn')}</span>`}</div>
      <div class="stats"><div><div class="s">${t('today')}</div><div class="v">172<small>${m('min')}</small></div></div><div><div class="s">${m('topapp')}</div><div class="v topapp"><span class="appicon"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="#25D366"/><path d="M12 6.5a5.5 5.5 0 0 0-4.7 8.3L6.5 17.5l2.8-.8A5.5 5.5 0 1 0 12 6.5z" fill="#fff"/></svg></span>96<small>${m('min')}</small></div></div><div><div class="s">${t('lastsync')}</div><div class="v" style="font-size:16px">● ${t('never')}</div></div></div>
      <div class="group">
        ${sect('sun', m('dayb'), m('dayb_sub'), `<span class="chev">⌄</span>`, 'acc')}
        ${sect('clock', t('interval'), t('mins'), `<b>60</b>`)}
      </div>
      <div class="group">
        ${sect('link', t('webhook'), `${hooks} ${t('configured')}`, `<span class="chev ${S.whOpenS ? 'open' : ''}">⌄</span>`, hooks ? 'acc' : '', 'whOpenS')}
        ${S.whOpenS ? `<div class="inner">${urlBlock}<div class="subrow"><span>${t('headers')}</span><span>${t('nonecfg')}</span></div></div>` : ''}
        ${sect('home', m('mqtt_t'), mqttSub, `<span class="chev">⌄</span>`, S.mqtt ? 'acc' : '')}
      </div>
      <div class="group">
        ${sect('tune', t('adv'), m('advsub_st'))}
        ${sect('bell', m('notif'), m('notif_sub'), `<span class="chev">⌄</span>`, 'acc')}
      </div>
      <div class="sect manualrow" style="padding:6px 8px"><div class="t">${m('manual')}</div><div class="sub">${m('syncnow_s')}</div></div>
      <div class="actions">
        <button class="btn primary">${m('syncnow')}</button>
        ${actList([['eye', m('preview')], ['share', m('export')]])}
        ${actGrid([['eye', m('prev_s')], ['send', m('ping_s')], ['share', m('export_s')]])}
      </div>
      <div class="foot">${m('syncing').replace('%1', hooks)}</div>
    </div>`, navbar('s'));

  const logItem = (dest, title, sub, pill, pillCls = '') =>
    `<div class="sect logrow"><div class="l"><span class="ico2">${I2[dest]}</span><div><div class="t">${title}</div><div class="sub">${sub}</div></div></div><span class="code ${pillCls}">${pill}</span></div>`;
  const logs = mainPhone(m('logs_title'), "lg", `
    <div class="topbar"><span style="width:24px"></span><b>${m('logs_title')}</b><span class="chev">ⓘ</span></div>
    <div class="body-scroll">
      <div class="banner logsb"><div class="bt"><b>${m('keep')}</b><span>${m('keep_sub')}</span></div><div class="switch ${S.keepFull ? 'on' : ''}" data-toggle="keepFull"></div></div>
      <div class="stats"><div><div class="s">${m('success')}</div><div class="v" style="color:#10B981">67%</div></div><div><div class="s">${m('total')}</div><div class="v">3</div></div><div><div class="s">${m('recs')}</div><div class="v">206</div></div></div>
      <div class="chips"><span class="chip2 on">${m('all')}</span><span class="chip2">${t('nav_h')}</span><span class="chip2">${t('nav_s')}</span></div>
      <div class="group logs">
        ${logItem('link', t('hc'), `12:30 · 142 ${t('records')}`, m('delivered'), 'ok')}
        ${logItem('home', t('hc'), `12:30 · 142 ${t('records')}`, m('published'), 'ok')}
        ${logItem('link', t('st'), `12:30 · 12 ${t('records')}`, m('failed'), 'bad')}
        ${logItem('link', t('hc'), `11:30 · 64 ${t('records')}`, m('queued'), 'warnc')}
      </div>
    </div>`, navbar('l'));

  const lrow = (ico, title, sub, ext = true) =>
    `<div class="linkrow"><span class="tile">${I2[ico]}</span><div style="min-width:0;flex:1"><div class="t">${title}</div><div class="s">${sub}</div></div>${ext ? '<span class="chev">↗</span>' : ''}</div>`;
  const about = mainPhone(m('about'), "", `
    <div class="topbar" style="justify-content:flex-start;gap:16px"><span class="chev" style="font-size:20px">←</span><b>${m('about')}</b></div>
    <div class="body-scroll">
      <div class="abouthero">
        <div class="disc">${document.body.classList.contains('premium') ? MARK : `<svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>`}</div>
        <h1>Life Dashboard</h1><div class="sub">Companion</div><span class="ver">${m('version')}</span>
      </div>
      <div class="aboutdesc">${m('desc')}</div>
      <div class="fgroup"><div class="fh"><span class="tile">${I2.heart}</span>${t('hc')}</div><ul><li>${m('hcb1')}</li><li>${m('hcb2')}</li><li>${m('hcb3')}</li><li>${m('hcb4')}</li></ul></div>
      <div class="fgroup"><div class="fh stg"><span class="tile st">${I2.phone}</span>${t('st')}</div><ul><li>${m('stb1')}</li><li>${m('stb2')}</li><li>${m('stb3')}</li></ul></div>
      <div class="fgroup"><div class="fh"><span class="tile">${I2.shield}</span>${m('privacy')}</div><ul><li>${m('pb1')}</li><li>${m('pb2')}</li><li>${m('pb3')}</li></ul></div>
      <div class="fgroup"><div class="fh"><span class="tile">${I2.save}</span>${m('backup')}</div><div class="s" style="font-size:13px;color:var(--muted);margin:-4px 0 12px">${m('backup_sub')}</div>
        <div class="bkbtns"><button class="btn outline">${m('exportb')}</button><button class="btn outline">${m('importb')}</button></div></div>
      ${lrow('book', m('docs'), m('docs_s'))}
      ${lrow('sparkle', m('whatsnew'), m('whatsnew_s'))}
      ${lrow('bug', m('report'), m('report_s'))}
      ${lrow('github', m('github'), 'owen282000/life-dashboard-companion-app')}
      ${lrow('coffee', m('coffee'), m('coffee_sub'))}
      ${lrow('shield', m('privacy_l'), m('privacy_ls'))}
      ${lrow('scale', m('licence'), m('licence_s'), false)}
    </div>`);

  document.getElementById('gallery2').innerHTML = health + screen + logs + about;
  scrollbottom();
}

// Interaction: card selection, fields, switches, test ping. Re-render keeps every phone in sync.
document.getElementById('gallery').addEventListener('click', e => {
  const sw = e.target.closest('[data-sw]');
  if (sw) { if (sw.dataset.sw === 'http') { S.http = !S.http; render(); } else sw.classList.toggle('on'); return; }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'later') { S.webhook = false; S.mqtt = false; render(); return; }
  if (act && act.dataset.act === 'ping') { S.ping = !(S.url.trim().toLowerCase().startsWith("http://") && !S.http); render(); return; }
  if (e.target.closest('input, button')) return;
  const c = e.target.closest('[data-pick]');
  if (!c) return;
  const id = c.dataset.pick;
  if (id === 'hc') S.hc = !S.hc; else if (id === 'st') S.st = !S.st;
  else if (id === 'webhook') S.webhook = !S.webhook; else if (id === 'mqtt') S.mqtt = !S.mqtt;
  else if (['ess','all','none'].includes(id)) S.preset = id;
  render();
});
document.getElementById('gallery').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  if (f === 'url') { S.url = e.target.value; S.ping = null; const len = e.target.value.length; render();
    const again = document.querySelector('[data-f="url"]'); again.focus(); again.setSelectionRange(len, len); }
  if (f === 'host') { S.host = e.target.value; }
});

document.getElementById('gallery2').addEventListener('click', e => {
  const tg = e.target.closest('[data-toggle]'); if (!tg) return;
  S[tg.dataset.toggle] = !S[tg.dataset.toggle]; renderMain();
});

// Controls
const root = document.documentElement.style;
const style = document.createElement('style');
style.textContent = `.premium .premium-hide { display: none; } body:not(.premium) .premium-only { display: none; }`;
document.head.appendChild(style);
document.querySelectorAll('.swatch').forEach(s => s.onclick = () => {
  document.querySelectorAll('.swatch').forEach(x => x.classList.remove('on')); s.classList.add('on'); root.setProperty('--accent', s.dataset.accent);
});
document.getElementById('variant').onchange = e => { document.body.classList.toggle('premium', e.target.value === 'premium'); render(); };
document.getElementById('dark').onchange = e => document.body.classList.toggle('dark', e.target.checked);
document.getElementById('hero').onchange = e => { S.hero = e.target.checked; render(); };
document.getElementById('radios').onchange = e => document.body.classList.toggle('no-radio', !e.target.checked);
document.getElementById('align').onchange = e => document.body.classList.toggle('align-center', e.target.value === 'center');
document.getElementById('cardstyle').onchange = e => document.body.classList.toggle('style-outlined', e.target.value === 'outlined');
document.getElementById('dotstyle').onchange = render;
document.getElementById('btnshape').onchange = e => root.setProperty('--radius-btn', e.target.value);
document.getElementById('fill').oninput = e => { root.setProperty('--card-fill-alpha', e.target.value / 100); document.getElementById('fillv').textContent = e.target.value + '%'; };
document.getElementById('lang').onchange = e => { S.lang = e.target.value; render(); };
render();
</script>
</body>
</html>
