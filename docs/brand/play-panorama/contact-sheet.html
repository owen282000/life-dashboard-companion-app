<!DOCTYPE html>
<!-- The eight rendered panels side by side, for a quick review. render.sh renders it to
     store-assets/contact-sheet.png (English) and contact-sheet-<lang>.png at 2620x680. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2620px; height: 680px; overflow: hidden; background: #E9ECEB; }
  .row { display: flex; gap: 20px; padding: 40px; }
  img { width: 300px; height: 600px; border-radius: 22px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
</style>
</head>
<body>
<div class="row">
  <img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt=""><img alt="">
</div>
<script>
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.querySelectorAll("img").forEach((img, n) => { img.src = `../../../store-assets/${lang}-${n + 1}.png`; });
</script>
</body>
</html>
