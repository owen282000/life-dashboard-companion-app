<!DOCTYPE html>
<!--
  Source for the Google Play phone screenshots in the panorama style: one wide composition of
  seven 1080x1920 panels (7560x1920), rendered whole (panorama-en.png) and per panel (en-1.png
  to en-7.png, panorama.html?panel=1 to ?panel=7) by docs/brand/play-panorama/render.sh.

  ?lang=nl and ?lang=de render the Dutch and German set (nl-1.png, de-1.png and so on) from the
  captures in store-src/nl/ and store-src/de/, with the captions and labels from TEXT below;
  English is the default. The Home Assistant and stack cards stay English, as they are.

  One continuous background, a heartbeat line through all seven panels, and two phones that
  lean well over into the next panel (losing only their right edge), so the row reads as one picture when swiping. Same
  messages and order as the flat set (docs/brand/store-shot.html, agreed on 17 October).

  Every phone screen is a real capture in docs/brand/store-src/ (see store-shot.html for where
  they come from; scripts/store-screenshots.sh takes the app's own, per language); nothing is
  drawn over the app. Floating cards are enlarged crops of those captures, or of Home Assistant
  and the separate Life Dashboard Stack, labelled as such. The webhook address with its secret
  on the Receive screen is left out by stacking the bands above and below it, as
  store-shot.html does.

  Play rules for the captions: no prices, rankings or calls to action, no other stores or
  platforms, no Google logos, no medical claims. The app itself contains no AI: the stack
  panel says the model is optional and runs on your own machine.

  Same identity as the other brand files: heartbeat green #30B77E (purple #B79BFF for screen
  time), the dark green-tinted ground and grid, "Helvetica Neue".
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 7560px; height: 1920px; overflow: hidden; background: #0C1714; }
  #stage {
    position: absolute; left: 0; top: 0; width: 7560px; height: 1920px; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff;
    background:
      radial-gradient(700px 700px at 420px 1200px, rgba(48,183,126,0.20), transparent 70%),
      radial-gradient(650px 650px at 1500px 1000px, rgba(48,183,126,0.13), transparent 70%),
      radial-gradient(700px 700px at 2500px 1250px, rgba(48,183,126,0.15), transparent 70%),
      radial-gradient(800px 800px at 3800px 1150px, rgba(155,120,255,0.20), transparent 70%),
      radial-gradient(700px 700px at 4700px 1150px, rgba(48,183,126,0.15), transparent 70%),
      radial-gradient(700px 700px at 5800px 1250px, rgba(48,183,126,0.15), transparent 70%),
      radial-gradient(700px 700px at 7000px 1100px, rgba(48,183,126,0.17), transparent 70%),
      linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%),
      linear-gradient(90deg, #11221D 0%, #0E1B18 20%, #101C1C 40%, #13162A 50%, #0F1D19 60%, #0E1A17 80%, #112019 100%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(48,183,126,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,183,126,0.055) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, black 45%, rgba(0,0,0,0.5) 100%);
  }
  svg.pulse { position: absolute; left: 0; top: 0; }

  /* Captions: a bold headline and a short subline at the top of each panel. */
  .cap { position: absolute; top: 96px; width: 960px; text-align: center; }
  .cap h1 {
    font-size: 98px; font-weight: 800; line-height: 1.03; letter-spacing: -2.5px;
    text-shadow: 0 6px 34px rgba(0,0,0,0.45);
  }
  .cap h1 em {
    font-style: normal;
    background: linear-gradient(90deg, #5BE3A6, #30B77E);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cap.purple h1 em { background: linear-gradient(90deg, #CDB8FF, #9B78FF); -webkit-background-clip: text; background-clip: text; }
  .cap p { margin: 26px auto 0; max-width: 900px; text-wrap: balance; font-size: 42px; line-height: 1.28; color: #B2C2BC; }

  /* A generic Android phone: flat graphite band, thin even bezel, a punch-hole camera. */
  .phone { position: absolute; transform-origin: 50% 40%; }
  .phone .body {
    position: relative; width: 100%; height: 100%; border-radius: var(--r);
    background: linear-gradient(135deg, #4A5054 0%, #24282B 25%, #16191B 50%, #272B2E 75%, #4B5155 100%);
    padding: var(--band);
    box-shadow: 0 50px 100px rgba(0,0,0,0.6), 0 16px 40px rgba(0,0,0,0.5), 0 0 130px rgba(48,183,126,0.18);
  }
  .phone .bezel { width: 100%; height: 100%; border-radius: calc(var(--r) - var(--band)); background: #000; padding: var(--bezel); }
  .phone .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden; background: #1B2421;
    border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background-size: 100% 100%; background-repeat: no-repeat;
  }
  .phone .hole { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; background: #000;
    box-shadow: inset 0 0 0 2px #15191B; }
  .phone .btn { position: absolute; right: -5px; width: 7px; border-radius: 3px; background: linear-gradient(90deg, #4A5054, #1E2225); }
  .phone .glare {
    position: absolute; inset: 0; border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background: linear-gradient(115deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 30%);
  }

  /* Floating cards: enlarged crops with a label saying where they come from. */
  .float { position: absolute; }
  .float .frame {
    border-radius: 28px; overflow: hidden; background: #111;
    border: 2px solid rgba(255,255,255,0.14);
    box-shadow: 0 40px 90px rgba(0,0,0,0.6), 0 0 0 10px rgba(0,0,0,0.12);
  }
  .float .label {
    display: inline-flex; align-items: center; gap: 12px; margin-bottom: 14px;
    padding: 12px 24px; border-radius: 999px; white-space: nowrap;
    font-size: 30px; font-weight: 700; color: #DDE7E3;
    background: rgba(10,18,16,0.88); border: 2px solid rgba(255,255,255,0.14);
    box-shadow: 0 14px 36px rgba(0,0,0,0.45);
  }
  .float .label small { font-weight: 500; color: #AEB8BC; }
  .float .label i { width: 16px; height: 16px; border-radius: 50%; background: var(--dot, #41BDF5); display: inline-block; flex: none; }
  .crop { background-repeat: no-repeat; }

  .badge {
    position: absolute; display: flex; align-items: center; gap: 22px;
    padding: 26px 40px 26px 28px; border-radius: 999px; white-space: nowrap;
    background: linear-gradient(135deg, rgba(48,183,126,0.96), rgba(32,140,95,0.96));
    color: #04140D; box-shadow: 0 34px 80px rgba(0,0,0,0.55), 0 0 80px rgba(48,183,126,0.45);
  }
  .badge b { display: block; font-size: 50px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .badge small { display: block; margin-top: 6px; font-size: 28px; font-weight: 600; opacity: 0.8; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <svg class="pulse" width="7560" height="1920" viewBox="0 0 7560 1920">
    <defs>
      <filter id="glow" x="-5%" y="-50%" width="110%" height="200%">
        <feGaussianBlur stdDeviation="8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#30B77E" stop-opacity="0.15"/>
        <stop offset="0.5" stop-color="#30B77E" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#30B77E" stop-opacity="0.2"/>
      </linearGradient>
    </defs>
    <path id="beat" fill="none" stroke="url(#fade)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </svg>
  <div id="items"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const LANG = ["nl", "de"].includes(params.get("lang")) ? params.get("lang") : "en";
document.documentElement.lang = LANG;
// The app's own screens per language; Home Assistant (H*) and the stack (S*) stay English.
const W = 1080, H = 1920, SRC = "../store-src/", APP = LANG === "en" ? SRC : `${SRC}${LANG}/`;

// Where things are in the captures, per language: [x, y, w, h] for a crop, [y0, y1] for the
// bands of a phone screen. scripts/store-screenshots.sh prints the rows these follow from.
const RECTS = {
  en: {
    DELETED: [160, 1054, 840, 190],         // A6-payload.png: "deleted_records" in the payload
    RECEIVE: [[0, 715], [913, 2400]],        // A7-receive.png without the address that holds the secret
  },
  nl: {
    DELETED: [160, 1026, 840, 190],
    RECEIVE: [[0, 736], [934, 2400]],
  },
  de: {
    DELETED: [160, 1048, 840, 190],
    RECEIVE: [[0, 757], [955, 2400]],
  },
};
const { DELETED, RECEIVE } = RECTS[LANG];

// Every word on the panels, per language. Dutch says "je", German "du"; the app's own terms
// from app/src/main/res/values-nl and values-de (aanvullen, Nachtragen, Schermtijd,
// Bildschirmzeit, ondertekend, signiert). A third value is a smaller headline size, for a
// language whose longest line would not fit at 98px.
const TEXT = {
  en: {
    cap1: [`Health Connect to<br><em>your own server</em>`, `Home Assistant, MQTT or your own webhook`],
    cap2: [`Pair with<br><em>one QR code</em>`, `No account, no YAML, no broker`],
    cap3: [`All your history<br><em>in one go</em>`, `Backfill: 30 days or everything. Home Assistant shows the last year day by day.`],
    cap4: [`Screen time<br><em>per app</em>`, `You choose which apps are sent`],
    cap5: [`Your history, for<br><em>your own AI</em>`, `Optional: the separate Life Dashboard Stack, with a model on your own machine`],
    stack: `Life Dashboard Stack <small>on your own server</small>`,
    cap6: [`Edits and deletions<br><em>are sent too</em>`, `Signed JSON for n8n, Node-RED or your scripts`],
    deleted: `Deleted, in the payload`,
    signed: `Signed`,
    cap7: [`Scale readings into<br><em>Health Connect</em>`, `Weight and blood pressure from Home Assistant`],
  },
  nl: {
    cap1: [`Health Connect naar<br><em>je eigen server</em>`, `Home Assistant, MQTT of je eigen webhook`],
    cap2: [`Koppelen met<br><em>één QR-code</em>`, `Geen account, geen YAML, geen broker`],
    cap3: [`Al je geschiedenis<br><em>in één keer</em>`, `Aanvullen: 30 dagen of alles. Home Assistant toont het afgelopen jaar per dag.`],
    cap4: [`Schermtijd<br><em>per app</em>`, `Jij kiest welke apps worden verstuurd`],
    cap5: [`Je geschiedenis voor<br><em>je eigen AI</em>`, `Optioneel: de losse Life Dashboard Stack, met een model op je eigen computer`],
    stack: `Life Dashboard Stack <small>op je eigen server</small>`,
    cap6: [`Ook wijzigingen<br><em>en verwijderingen</em>`, `Ondertekende JSON voor n8n, Node-RED of je eigen scripts`],
    deleted: `Verwijderd, in de payload`,
    signed: `Ondertekend`,
    cap7: [`Metingen van je weegschaal<br><em>in Health Connect</em>`, `Gewicht en bloeddruk uit Home Assistant`],
  },
  de: {
    cap1: [`Von Health Connect<br><em>auf deinen Server</em>`, `Home Assistant, MQTT oder dein eigener Webhook`],
    cap2: [`Koppeln mit<br><em>einem QR-Code</em>`, `Kein Konto, kein YAML, kein Broker`],
    cap3: [`Dein ganzer Verlauf<br><em>auf einmal</em>`, `Nachtragen: 30 Tage oder alles.<br>Home Assistant zeigt das letzte Jahr pro Tag.`],
    cap4: [`Bildschirmzeit<br><em>pro App</em>`, `Du wählst, welche Apps gesendet werden`],
    cap5: [`Dein Verlauf für<br><em>deine eigene KI</em>`, `Optional: der separate Life Dashboard Stack, mit einem Modell auf deinem eigenen Rechner`],
    stack: `Life Dashboard Stack <small>auf deinem eigenen Server</small>`,
    cap6: [`Auch Änderungen<br><em>und Löschungen</em>`, `Signiertes JSON für n8n, Node-RED oder deine Skripte`],
    deleted: `Gelöscht, im Payload`,
    signed: `Signiert`,
    cap7: [`Waagenwerte<br><em>in Health Connect</em>`, `Gewicht und Blutdruck aus Home Assistant`],
  },
};
const T = TEXT[LANG];

// The heartbeat: a flat line through every panel with a beat between the phones.
(function () {
  const y = 1640, beats = [460, 2900, 4150, 6000, 7150];
  let d = `M -20 ${y}`;
  for (const x of beats) d += ` L ${x - 90} ${y} L ${x - 60} ${y - 100} L ${x - 15} ${y + 150} L ${x + 25} ${y - 45} L ${x + 55} ${y}`;
  d += ` L 7580 ${y}`;
  document.getElementById("beat").setAttribute("d", d);
})();

// A phone of outer width w at (x, y). `screen` is a capture, or [capture, bands] to stack
// horizontal bands of it, leaving out a band that holds a secret.
function phone(screen, x, y, w, transform = "", z = 2) {
  const band = Math.round(w * 0.012), bezel = Math.round(w * 0.018);
  const sw = w - 2 * band - 2 * bezel, sh = Math.round(sw * 2400 / 1080);
  const h = sh + 2 * band + 2 * bezel, r = Math.round(w * 0.085), k = sw / 1080;
  let inner, bg = "";
  if (typeof screen === "string") bg = `background-image:url(${screen})`;
  else inner = screen[1].map(([y0, y1]) => crop(screen[0], 1080, [0, y0, 1080, y1 - y0], sw)).join("");
  const hole = `<div class="hole" style="top:${Math.round(22 * k)}px;width:${Math.round(34 * k)}px;height:${Math.round(34 * k)}px"></div>`;
  const btns = `<div class="btn" style="top:${Math.round(h * 0.2)}px;height:${Math.round(h * 0.09)}px"></div>` +
    `<div class="btn" style="top:${Math.round(h * 0.33)}px;height:${Math.round(h * 0.05)}px"></div>`;
  return `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:${transform};z-index:${z};` +
    `--r:${r}px;--band:${band}px;--bezel:${bezel}px">${btns}<div class="body"><div class="bezel">` +
    `<div class="screen" style="${bg}">${inner || ""}${hole}<div class="glare"></div></div></div></div></div>`;
}

// A crop of an image: rect [x, y, w, h] in its pixels, shown `width` wide.
function crop(src, srcW, rect, width) {
  const [x, y, w, h] = rect, k = width / w;
  return `<div class="crop" style="width:${width}px;height:${Math.round(h * k)}px;background-image:url(${src});` +
    `background-size:${Math.round(srcW * k)}px auto;background-position:${-Math.round(x * k)}px ${-Math.round(y * k)}px"></div>`;
}

function float(html, x, y, { label, dot, rotate = 0, z = 5, bg } = {}) {
  return `<div class="float" style="left:${x}px;top:${y}px;transform:rotate(${rotate}deg);z-index:${z};${dot ? `--dot:${dot}` : ""}">` +
    (label ? `<div class="label"><i></i>${label}</div>` : "") +
    `<div class="frame" style="${bg ? `background:${bg}` : ""}">${html}</div></div>`;
}

// size: a smaller headline, for a language whose longest line would not fit at 98px. Names
// in the subline stay on one line.
function caption(n, [h, p, size], cls = "") {
  p = p.replace(/Home Assistant|Health Connect|Node-RED/g, (name) => `<span style="white-space:nowrap">${name}</span>`);
  const style = size ? ` style="font-size:${size}px;letter-spacing:${(-2.5 * size / 98).toFixed(1)}px"` : "";
  return `<div class="cap ${cls}" style="left:${(n - 1) * W + 60}px"><h1${style}>${h}</h1><p>${p}</p></div>`;
}

const tilt = (rz, ry = 0) => `perspective(2600px) rotateY(${ry}deg) rotate(${rz}deg)`;
const shield = `<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#04140D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.3 12.2l2.6 2.6 4.9-5.2"/></svg>`;
const X = (n, lx) => (n - 1) * W + lx;
const items = [];

// 1. Health Connect to your own server
items.push(caption(1, T.cap1));
// The phone leans well over into panel 2; only its right edge, chevrons and buttons, goes.
items.push(phone(APP + "A1-health.png", X(1, 610), 470, 640, tilt(6, -8), 4));
items.push(float(crop(SRC + "H1-today.png", 1082, [18, 296, 1046, 318], 660),
  X(1, 40), 960, { label: "Home Assistant", rotate: -3, z: 6 }));

// 2. Pair with one QR code
items.push(caption(2, T.cap2));
items.push(phone(APP + "A2-pair.png", X(2, 400), 480, 620, tilt(-4, 10)));
items.push(float(crop(SRC + "H2-qr.png", 1082, [62, 232, 848, 848], 400),
  X(2, 150), 1220, { label: "Home Assistant", rotate: -5, z: 6 }));

// 3. All your history in one go: the backfill lengths, up to everything Health Connect has
items.push(caption(3, T.cap3));
items.push(phone(APP + "A3-backfill.png", X(3, 60), 480, 640, tilt(-5, 8)));
// Below the lengths, so "All history" stays in view.
items.push(float(crop(SRC + "H3-history.png", 1082, [20, 296, 1044, 735], 460),
  X(3, 470), 1480, { label: "Home Assistant", rotate: -3, z: 6 }));

// 4. Screen time per app
items.push(caption(4, T.cap4, "purple"));
// The phone leans well over into panel 5.
items.push(phone(APP + "A4-screen-time.png", X(4, 590), 470, 640, tilt(6, -8), 4));
items.push(float(crop(SRC + "H4-apps.png", 1082, [20, 468, 1042, 954], 560),
  X(4, 50), 900, { label: "Home Assistant", dot: "#B79BFF", rotate: -4, z: 6 }));

// 5. Your history for your own AI, through the separate stack
items.push(caption(5, T.cap5));
items.push(phone(APP + "A5-webhook.png", X(5, 400), 520, 600, tilt(-5, 10)));
items.push(float(crop(SRC + "S5-chat.png", 1082, [24, 190, 1040, 500], 640),
  X(5, 110), 1180, { label: T.stack, dot: "#30B77E", rotate: -3, z: 6 }));

// 6. Edits and deletions are sent too
items.push(caption(6, T.cap6));
items.push(phone(APP + "A6-payload.png", X(6, 60), 480, 620, tilt(-5, 8)));
items.push(float(crop(APP + "A6-payload.png", 1080, DELETED, 560),
  X(6, 460), 1050, { label: T.deleted, dot: "#E06C75", rotate: -3, z: 6 }));
items.push(`<div class="badge" style="left:${X(6, 560)}px;top:1420px;transform:rotate(4deg);z-index:6">${shield}<div><b>${T.signed}</b><small>HMAC-SHA256</small></div></div>`);

// 7. Scale readings into Health Connect
items.push(caption(7, T.cap7));
items.push(phone([APP + "A7-receive.png", RECEIVE], X(7, 400), 480, 640, tilt(5, -10)));
items.push(float(crop(APP + "A7-hc-weight.png", 1080, [30, 500, 1020, 560], 560),
  X(7, 40), 1150, { label: "Health Connect", dot: "#30B77E", rotate: -4, z: 6 }));

document.getElementById("items").innerHTML = items.join("");

// ?panel=n shows one 1080-wide panel of the panorama.
const panel = +(params.get("panel") || 0);
if (panel) {
  document.documentElement.style.width = document.body.style.width = W + "px";
  document.getElementById("stage").style.transform = `translateX(${-(panel - 1) * W}px)`;
}
</script>
</body>
</html>
