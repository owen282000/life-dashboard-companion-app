<!DOCTYPE html>
<!--
  Source for the Google Play phone screenshots: one wide panorama of eight panels, 10560x2640, that
  render.sh renders into store-assets/, which is not in git, whole (panorama-en.png) and per
  panel (en-1.png to en-8.png, 1320x2640: Play takes at most 2:1). ?lang= picks the language, from
  store-assets/raw/<lang>/; English is the default. ?panel=1 to ?panel=8 shows one panel.

  One ground, one heartbeat line running through all eight panels at the app's own stroke (the
  line of the design so it runs into the Grafana card in panel 8),
  and phones that lean over the edge into the next panel. Arabic mirrors the whole row, because
  Google Play runs right to left there and the app does too. The line turns the app's Screen Time
  purple for panel 4, the part only Android has.

  The order: panel 1 carries the whole promise, for every receiver, with Home as it opens. 2 and 3
  are the two ways in: one QR code for any receiver that shows one, and a signed webhook or MQTT
  for people who build their own. 4 is Screen Time. 5, 6 and 7 are what people check before
  installing: what goes out, the history, and whether it arrived. 8 closes on what you get: your own dashboards.

  Every phone screen is a real capture of the app on the store emulator (store-assets/raw/, from
  scripts/store-screenshots.sh), at its native 1080x2400. The floating cards are enlarged crops of
  those captures, found by measure.py. The X-Signature line in panel 3 is the header the app sends,
  with an example value; pairing-example-qr.svg is the made-up link of docs/pairing.md, which is
  what the phone in panel 2 opened. Nothing in them is anyone's real data. Panel 8 shows the
  results: results/ holds the Grafana overview of the stack's docs and the Home Assistant dashboard
  of the site, the same example images those pages show.

  Rules for the captions: only what the app does. No prices, no "no subscription", no rankings, no
  competitors, no other stores or platforms, no Google logos, no medical claims, no number of data
  types. n8n and Grafana are named as places the webhook can go. Home Assistant is one receiver next
  to the others, never the only one.

  Brand: ground #0A0F0D, accent #30B77E, Screen Time #8B5CF6, Space Grotesk. Scripts it has no
  glyphs for use a system font of this Mac: Hiragino Sans (ja), PingFang SC (zh-CN), SF Arabic
  (ar), Kohinoor Devanagari (hi).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 400; src: url(../../../app/src/main/res/font/space_grotesk_regular.ttf); }

  html, body { width: 10560px; height: 2640px; overflow: hidden; background: var(--ground); }
  #stage {
    position: absolute; left: 0; top: 0; width: 10560px; height: 2640px; overflow: hidden;

  .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(48,183,126,0.13), rgba(48,183,126,0)); z-index: 0; }
  .glow.purple { background: radial-gradient(closest-side, rgba(139,92,246,0.24), rgba(139,92,246,0)); }

  /* A generic Android phone: a flat graphite band, a thin even bezel, a punch-hole camera. */
  .phone { position: absolute; transform-origin: 50% 40%; }
  .phone .body {
    position: relative; width: 100%; height: 100%; border-radius: var(--r);
    background: linear-gradient(135deg, #5A6268 0%, #2A2F33 22%, #1A1D20 50%, #2E3438 78%, #5B6369 100%);
    padding: var(--band);
    box-shadow: 0 60px 120px rgba(0,0,0,0.7), 0 20px 50px rgba(0,0,0,0.6);
  }
  .phone .bezel { width: 100%; height: 100%; border-radius: calc(var(--r) - var(--band)); background: #000; padding: var(--bezel); }
  .phone .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border-radius: calc(var(--r) - var(--band) - var(--bezel));
    background-size: 100% 100%; background-repeat: no-repeat;
  }
  .phone .hole { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 50%; }
  .phone .btn { position: absolute; width: 8px; border-radius: 4px; background: linear-gradient(90deg, #22272A, #5A6268); }

  /* Floating cards: enlarged crops of the captures. */
  .float { position: absolute; z-index: 5; }
  .float .frame {
    border-radius: var(--radius, 40px); overflow: hidden; background: var(--tile);
    border: 2px solid var(--tile-border); box-shadow: 0 50px 100px rgba(0,0,0,0.65);
  }
  .float.bare .frame { border: 0; background: transparent; }
  .float.ground .frame { background: var(--ground); }
  .crop { background-repeat: no-repeat; }
  .float.fade .crop { -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }

  /* The capture of About, on the same ground: no frame, the line runs straight into it. */
  .seam { position: absolute; z-index: 2; mix-blend-mode: lighten; }

  .code {
    position: absolute; z-index: 7; padding: 28px 38px; border-radius: 30px; direction: ltr; white-space: nowrap;
    font-family: "Space Mono", monospace; font-size: 46px; color: #6FE0AE;
    background: var(--tile); border: 2px solid var(--tile-border); box-shadow: 0 40px 80px rgba(0,0,0,0.6);
  }

  .sign { position: absolute; display: flex; align-items: center; gap: 32px; z-index: 6; }
  .sign img { width: 170px; height: 170px; border-radius: 38px; box-shadow: 0 0 0 2px var(--tile-border); }
  .sign b { font-size: 68px; font-weight: 700; letter-spacing: -0.01em; }

    history: ["补全您的", "全部历史数据", "以 3 天为一批，从最早的数据开始发送，记录不会被重复计算"],
    logs: ["每次传送", "都有日志", "每次传送的状态码、记录和数据包，都能查看"],
    about: ["您的数据", "尽在您自己的仪表板", "Home Assistant、Grafana 或任何能读取 JSON 的工具"],
  },
};
const T = TEXT[LANG];

// Rows and cards in the captures, from measure.py through rects.js.
const R = MEASURED[LANG];

// Panel n, x from its reading start, for something w wide. Arabic mirrors the row.
const sx = (n, x, w = 0) => RTL ? (PANELS - n) * W + (W - x - w) : (n - 1) * W + x;
const flip = (deg) => RTL ? -deg : deg;

// The heartbeat, in the proportions of the design. It runs flat
// at THREAD_Y with one beat in every panel, drops behind the phone of panel 7 and runs into
// the Grafana card of panel 8 at SPLIT_Y. Purple over panel 4 only, with a short change on both sides of it.
const THREAD_Y = 800, SPLIT_Y = 1210;
(function () {
  const beats = [0, 1, 2, 3, 4, 5, 6].map((n) => n * W + 590);
  let d = `M -20 ${THREAD_Y}`;
  for (const x of beats) d += ` H ${x} l 35 -83 l 55 167 l 48 -122 l 22 38`;
  const last = (PANELS - 1) * W;
  d += ` H ${last - 260} C ${last - 120} ${THREAD_Y}, ${last - 140} ${SPLIT_Y}, ${last + 160} ${SPLIT_Y}`;
  const g = document.getElementById("thread");
  if (RTL) g.setAttribute("transform", `translate(${TOTAL} 0) scale(-1 1)`);
  g.innerHTML = `<path d="${d}"/>`;
  // In the coordinates of the path, which the transform above mirrors along with its gradient.
  const a = 3 * W / TOTAL, b = 4 * W / TOTAL, fade = 160 / TOTAL;
  document.getElementById("thread-color").innerHTML =
    `<stop offset="${a - fade}" stop-color="#30B77E"/><stop offset="${a}" stop-color="#8B5CF6"/>` +
    `<stop offset="${b}" stop-color="#8B5CF6"/><stop offset="${b + fade}" stop-color="#30B77E"/>`;
})();

// A phone of outer width w, showing a capture of 1080x2400, leaning by rz and ry degrees.
function phone(src, n, x, y, w, rz = 0, ry = 0, z = 3, purple = false) {
  const band = Math.round(w * 0.016), bezel = Math.round(w * 0.02);
  const sw = w - 2 * band - 2 * bezel, sh = Math.round(sw * 2400 / 1080);
  const h = sh + 2 * band + 2 * bezel, r = Math.round(w * 0.105);
  const k = sw / 1080, d = Math.round(52 * k);
  const hole = `<div class="hole" style="top:${Math.round(24 * k)}px;width:${d}px;height:${d}px"></div>`;
  const side = RTL ? "left" : "right";
  const btns = `<div class="btn" style="${side}:-6px;top:${Math.round(h * 0.2)}px;height:${Math.round(h * 0.07)}px"></div>` +
    `<div class="btn" style="${side}:-6px;top:${Math.round(h * 0.3)}px;height:${Math.round(h * 0.12)}px"></div>`;
  const left = sx(n, x, w);
  const glow = `<div class="glow${purple ? " purple" : ""}" style="left:${left - 260}px;top:${y - 100}px;width:${w + 520}px;height:${h + 200}px"></div>`;
  return glow + `<div class="phone" style="left:${left}px;top:${y}px;width:${w}px;height:${h}px;` +
    `transform:perspective(3200px) rotateY(${flip(ry)}deg) rotate(${flip(rz)}deg);z-index:${z};` +
    `--r:${r}px;--band:${band}px;--bezel:${bezel}px">${btns}<div class="body"><div class="bezel">` +
    `<div class="screen" style="background-image:url(${src})">${hole}</div></div></div></div>`;
}

// A crop of a capture: rect [x, y, w, h] in its pixels, shown `width` wide.
function crop(src, rect, width) {
  const [x, y, w, h] = rect, k = width / w;
  return `<div class="crop" style="width:${width}px;height:${Math.round(h * k)}px;background-image:url(${src});` +
    `background-size:${Math.round(1080 * k)}px auto;background-position:${-Math.round(x * k)}px ${-Math.round(y * k)}px"></div>`;
}

function float(html, n, x, y, w, { rotate = 0, z = 5, radius, kind = "" } = {}) {
  return `<div class="float ${kind}" style="left:${sx(n, x, w)}px;top:${y}px;width:${w}px;transform:rotate(${flip(rotate)}deg);z-index:${z};${radius ? `--radius:${radius}px` : ""}">` +
    `<div class="frame">${html}</div></div>`;
}

function caption(n, [line, accent, sub], { tag, labels, purple } = {}) {
  return `<div class="cap${purple ? " purple" : ""}" data-fit dir="${RTL ? "rtl" : "ltr"}" style="left:${sx(n, 84, 1152)}px;"><h1><span>${line}</span><span><em>${accent}</em></span></h1>` +
    (tag ? `<div class="tag">${tag}</div>` : "") +
    (labels ? `<div class="receivers">${labels.map((label) => `<span>${label}</span>`).join("")}</div>` : "") +
    (sub ? `<p>${sub}</p>` : "") + `</div>`;
}

const PHONE_Y = 890, PHONE_W = 800;
const items = [];

// 1. The promise, on Home, with its receivers side by side.
items.push(caption(1, T.lead, { tag: T.tag, labels: ["Home Assistant", T.webhook, "MQTT"] }));
items.push(phone(RAW + "home.png", 1, 70, PHONE_Y, PHONE_W, -5, 7));
items.push(float(crop(RAW + "home.png", R.dests, 720), 1, 560, 2020, 720, { rotate: 3 }));

// 2. Any receiver: one QR code, and what comes after Pair.
items.push(caption(2, T.pair));
items.push(phone(RAW + "pairing.png", 2, -40, PHONE_Y, PHONE_W, 3, -8));
items.push(float(`<img src="../pairing-example-qr.svg" style="display:block;width:500px;height:500px">`, 2, 760, 1290, 500, { rotate: -4, z: 6, kind: "bare" }));
items.push(float(crop(RAW + "paired.png", R.connected, 1000), 2, 240, 2070, 1000, { rotate: 2, z: 7, kind: "ground" }));

// 3. For builders: the payload and its signature.
items.push(caption(3, T.hook));
items.push(phone(RAW + "delivery.png", 3, 580, PHONE_Y, PHONE_W, 5, -8));
items.push(float(crop(RAW + "webhook.png", R.signing, 720), 3, 30, 1200, 720, { rotate: -3, z: 6, kind: "ground" }));
items.push(float(crop(RAW + "delivery.png", R.payload, 760), 3, 30, 1650, 760, { rotate: 3, z: 6, kind: "fade" }));
items.push(`<div class="code" style="left:${sx(3, 40, 960)}px;top:2260px;width:960px;transform:rotate(${flip(-2)}deg)">X-Signature: sha256=9f2c41a7e0&hellip;</div>`);

// 4. Screen time, in its own purple.
items.push(caption(4, T.screen, { purple: true }));
items.push(phone(RAW + "screen-time.png", 4, 110, PHONE_Y, PHONE_W, -4, 7, 3, true));
items.push(float(crop(RAW + "screen-time.png", R.used, 760), 4, 520, 1720, 760, { rotate: 3, kind: "ground" }));

// 5. What to send.
items.push(caption(5, T.what));
items.push(phone(RAW + "what.png", 5, 580, PHONE_Y, PHONE_W, 4, -7));
const pillWidth = Math.min(620, Math.round(R.essentials[2] * 1.9));
items.push(float(crop(RAW + "what.png", R.essentials, pillWidth), 5, 70, 1080, pillWidth, { rotate: -5, z: 6, radius: 200, kind: "bare" }));
items.push(float(crop(RAW + "category.png", R.switches, 860), 5, 40, 1400, 860, { rotate: -3, z: 6 }));
items.push(float(crop(RAW + "what.png", R.goesOut, 860), 5, 60, 2090, 860, { rotate: 2, z: 6 }));

// 6. The history.
items.push(caption(6, T.history));
items.push(phone(RAW + "backfill.png", 6, 110, PHONE_Y, PHONE_W, -4, 7));
items.push(float(crop(RAW + "backfill-run.png", R.progress, 1040), 6, 200, 1860, 1040, { rotate: 3, kind: "ground" }));

// 7. The proof.
items.push(caption(7, T.logs));
items.push(phone(RAW + "logs.png", 7, 580, PHONE_Y, PHONE_W, 5, -8));
items.push(float(crop(RAW + "logs.png", R.logRows, 960), 7, 30, 1640, 960, { rotate: -3, z: 6, kind: "ground" }));

// 8. The result: the line of the row runs into Grafana, with Home Assistant on a phone in front.
items.push(caption(8, T.about));
items.push(float(`<div style="width:1500px;height:780px;background:url(results/grafana-overview.png) 0 0/1500px auto no-repeat"></div>`, 8, 60, 960, 1500, { rotate: 2, z: 4 }));
items.push(phone("results/ha-dashboard.png", 8, 90, 1560, 480, -4, 6, 6));

document.getElementById("items").innerHTML = items.join("");

// Each headline as large as its longest line allows, the same size for the two lines.
document.fonts.ready.then(() => {
  document.querySelectorAll("[data-fit]").forEach((cap) => {
    const h1 = cap.querySelector("h1");
    const max = 132;
    h1.style.fontSize = max + "px";
    const widest = Math.max(...[...h1.children].map((line) => line.getBoundingClientRect().width));
    h1.style.fontSize = Math.floor(Math.min(max, max * 1150 / widest)) + "px";
  });
  document.body.dataset.ready = "1";
});

// ?panel=n shows one 1320-wide panel of the panorama.
const panel = +(params.get("panel") || 0);
if (panel) {
  document.documentElement.style.width = document.body.style.width = W + "px";
  document.getElementById("stage").style.transform = `translateX(${-sx(panel, 0, W)}px)`;
}
</script>
</body>
</html>
