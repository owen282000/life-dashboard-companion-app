[versions]
agp = "9.4.1"
ktlint = "14.2.0"
kover = "0.9.11"
kotlin = "2.4.21"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
androidxTest = "1.7.0"
uiautomator = "2.4.0"
jsonSchemaValidator = "0.5.5"
# What the app already resolves to, through Compose and Activity. Dependabot never proposes a
# lifecycle bump: Google Maven publishes no release dates, its cooldown filter drops every stable
# version for that, and the newest version is always an alpha. Bump it by hand.
lifecycleRuntimeKtx = "2.11.0"
coroutines = "1.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
healthConnect = "1.1.0"
workManager = "2.12.0"
hivemqMqtt = "1.4.1"
okhttp = "5.5.1"
kotlinxSerialization = "1.11.0"
splashScreen = "1.2.0"
glance = "1.1.1"
camerax = "1.6.2"
zxing = "3.5.4"
# Only in the Google Play build (playImplementation): the in-app review dialog, P1-28.
playReview = "2.0.2"
fragment = "1.8.9"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# The instrumented suite (app/src/androidTest): runner and rules, UiAutomator only as the fallback
# for Health Connect's permission dialog, the test WorkManager (same version as the runtime), a
# webhook receiver in the test process, and a validator for docs/webhook-schema.json.
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTest" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }
okhttp-mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { group = "com.squareup.okhttp3", name = "okhttp-tls", version.ref = "okhttp" }
json-schema-validator = { group = "io.github.optimumcode", name = "json-schema-validator", version.ref = "jsonSchemaValidator" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashScreen" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
# The QR scanner: CameraX for the preview and frames, zxing core for the decoding.
# Both Apache-2.0 and free of Play Services, unlike ML Kit, which even in its bundled
# form depends on play-services-basement and would cost the F-Droid listing.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# Google Play's In-App Review API. Never on the release build that GitHub and F-Droid ship, which
# stays free of Google libraries; see the play build type in app/build.gradle.kts.
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }
# In the Play build only, over the Fragment 1.1.0 that Play's libraries ask for.
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
hivemq-mqtt = { group = "com.hivemq", name = "hivemq-mqtt-client", version.ref = "hivemqMqtt" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Call.executeAsync(): a request that is cancelled with the coroutine that waits for it.
okhttp-coroutines = { group = "com.squareup.okhttp3", name = "okhttp-coroutines", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
