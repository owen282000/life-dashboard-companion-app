version: 2
updates:
  # Keeps the SHA-pinned workflow actions up to date (pins never move on their own)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The repo's commit style, "build(deps): Bump ...", set rather than guessed from history
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
