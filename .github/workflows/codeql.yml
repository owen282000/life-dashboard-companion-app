name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so Gradle can derive the version from git tags

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      # One daemon runs every Gradle step of the job in a row (ktlint, tests, Kover over every
      # variant, lint, the APK), and with the 2 GB from gradle.properties D8 ran out of heap
      # merging dex on main (run 37022282822). The runner has 16 GB; local builds and the
      # F-Droid build keep gradle.properties, since the user-home file only exists here.
      - name: Give the Gradle daemon more heap
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual

      # Without --no-build-cache a source tree that was built before comes back
      # FROM-CACHE task by task, nothing compiles, and CodeQL sees no Kotlin at all.
      - name: Build app for analysis
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:java-kotlin"
