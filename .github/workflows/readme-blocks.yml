name: README blocks

# The nine Life Dashboard READMEs share three blocks: the nav, "How this is built" and the
# footer. docs/brand/readme-blocks.py generates them, and this workflow checks every day that
# each README on main still carries the generated text, so a block edited by hand in one
# repository is noticed. It only downloads public files and needs no token.
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - docs/brand/readme-blocks.py
      - .github/workflows/readme-blocks.yml
  pull_request:
    branches: [main]
    paths:
      - docs/brand/readme-blocks.py
      - .github/workflows/readme-blocks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the blocks in all nine READMEs
        run: python3 docs/brand/readme-blocks.py --check
