name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so Gradle can derive the version from git tags

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check for hardcoded UI strings
        run: |
          # Android's HardcodedText lint only inspects XML layouts, so it sees nothing in a
          # Compose UI. This is the equivalent guard; it keeps new screens translatable.
          chmod +x scripts/check-hardcoded-strings.sh
          ./scripts/check-hardcoded-strings.sh
      - name: Check for swallowed cancellations
        run: |
          # A catch-all in suspend code that does not rethrow CancellationException turns a
          # stopped worker into a wrong result (1.18.0). Known cases are allowlisted and may
          # only shrink.
          chmod +x scripts/check-cancellation.sh
          ./scripts/check-cancellation.sh
      - name: Run ktlint
        run: ./gradlew ktlintCheck
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Coverage report
        run: ./gradlew koverXmlReport
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: app/build/reports/kover/report.xml
          retention-days: 30

      - name: Run Android Lint
        run: ./gradlew lintDebug
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # The sync path on a real Android runtime: Health Connect, the webhook receiver, the outbox,
  # Receive, WorkManager in test mode. Same script as locally (docs/building.md), on an
  # emulator named like the local AVD so the script's device check holds here too.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so Gradle can derive the version from git tags

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Built before the emulator starts: a heavy Gradle build next to the emulator is what
      # makes QEMU hang on the free runners.
      - name: Build the APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest
          ./gradlew --stop

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Every line of `script` is its own shell and the emulator is killed right after, so the
      # whole run, reports included, is one line. A pull request runs the suite without the
      # @LargeTest tests (the real 20 s budgets and hanging calls); a push to main and a manual
      # run take everything.
      - name: Run the suite on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: ldc-instrumented
          disk-size: 4096M
          disable-animations: true
          script: ./scripts/instrumented.sh --ci ${{ github.event_name == 'pull_request' && '--small' || '' }}

      - name: Upload the JUnit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: instrumented-junit
          path: build/instrumented/junit.xml
          retention-days: 30

      - name: Upload logcat and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: instrumented-evidence
          path: build/instrumented/
          retention-days: 14
