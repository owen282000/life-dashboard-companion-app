name: Gradle wrapper

# Checks gradle/wrapper/gradle-wrapper.jar against the checksums Gradle publishes. On its own,
# so it finishes in seconds: OpenSSF Scorecard only treats the jar as validated when this
# workflow already succeeded on the commit it scans, and Scorecard runs on the same push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
