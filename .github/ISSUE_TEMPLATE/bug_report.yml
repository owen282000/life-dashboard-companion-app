name: Bug report
description: Something is broken or not working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For setup questions and "how do I get X into Home Assistant", use
        [Discussions](https://github.com/owen282000/life-dashboard-companion-app/discussions)
        instead. The [troubleshooting guide](https://github.com/owen282000/life-dashboard-companion-app/blob/main/docs/usage.md#troubleshooting)
        answers the most common problems: syncs stopping after a while, plain HTTP being
        refused, totals that look far too high, and nightly metrics arriving late.
  - type: checkboxes
    id: checked
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I read the troubleshooting section in docs/usage.md
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable data type X
        2. Tap Sync Now
        3. ...
    validations:
      required: true
  - type: dropdown
    id: destination
    attributes:
      label: Where does the data go?
      description: The two paths behave differently, and this narrows it down immediately.
      options:
        - Webhook
        - MQTT / Home Assistant
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: sourceapp
    attributes:
      label: Which app wrote the data to Health Connect?
      description: >
        The single most useful answer for a data bug. Sources differ in what they write and
        when; docs/DATA_SOURCES.md was largely built from these reports. Leave empty for a
        Screen Time issue.
      placeholder: "Fitbit, Zepp, Garmin Connect, Samsung Health, Health Sync, the phone itself, ..."
  - type: dropdown
    id: channel
    attributes:
      label: Where did you install the app from?
      description: Builds can differ, and an F-Droid build may lag behind the GitHub release.
      options:
        - GitHub release
        - F-Droid
        - IzzyOnDroid
        - Obtainium
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.14.0 (see the About screen)"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 16, Samsung Galaxy S24"
    validations:
      required: true
  - type: input
    id: healthconnect
    attributes:
      label: Health Connect version (if relevant)
      placeholder: "See Health Connect app info"
  - type: textarea
    id: logs
    attributes:
      label: Relevant delivery logs
      description: >
        Expand the failing entry on the Logs tab. Remove or redact your webhook URL, broker
        address and any personal health data before pasting.
