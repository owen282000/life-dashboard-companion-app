name: Bug report
description: Something is broken or not working as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable data type X
        2. Tap Sync Now
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.4.0 (see the About screen)"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 16, Google Pixel 9"
    validations:
      required: true
  - type: input
    id: healthconnect
    attributes:
      label: Health Connect version (if relevant)
      placeholder: "See Health Connect app info"
  - type: textarea
    id: logs
    attributes:
      label: Relevant webhook logs
      description: Expand the failing entry in the logs screen. Remove or redact your webhook URL and any personal health data before pasting.
