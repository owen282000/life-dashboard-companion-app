# Questions belong in Discussions. A blank issue is rarely the right first step, and
# "how do I get X into Home Assistant" kept arriving as a bug report.
blank_issues_enabled: false
contact_links:
  - name: Question or setup help
    url: https://github.com/owen282000/life-dashboard-companion-app/discussions
    about: Setup questions, Home Assistant help and ideas. Usually faster than an issue, and findable later.
  - name: Troubleshooting guide
    url: https://github.com/owen282000/life-dashboard-companion-app/blob/main/docs/usage.md#troubleshooting
    about: Syncs stopping, plain HTTP refused, totals too high, nightly metrics arriving late.
  - name: Security vulnerability
    url: https://github.com/owen282000/life-dashboard-companion-app/security/advisories/new
    about: Report security problems privately, never as a public issue. See SECURITY.md.
  - name: Home Assistant integration
    url: https://github.com/owen282000/life-dashboard-ha/issues
    about: Problems with the Life Dashboard integration in Home Assistant belong in its own repository.
  - name: iOS app
    url: https://github.com/owen282000/life-dashboard-companion-app-ios/issues
    about: Issues with the iOS app belong in its own repository.
